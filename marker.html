<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Heritage AR Guide — Marker AR</title>

<!-- iOS Safari Camera Fixes & WebAR Libraries -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    width:100%; 
    height:100%; 
    overflow:hidden; 
    background:#000; 
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    position: fixed; /* Prevents iOS rubber-band scrolling */
  }

  #ui { position:fixed; inset:0; z-index:20; pointer-events:none; }

  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 16px 16px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
  }
  #home {
    pointer-events:auto; color:#fff; text-decoration:none;
    background:rgba(0,0,0,0.55); padding:9px 16px; border-radius:25px;
    font-size:14px; font-weight:600;
  }
  #status {
    color:#fff; background:rgba(0,0,0,0.55); padding:9px 16px;
    border-radius:25px; font-size:13px; font-weight:600;
  }
  #status.found { background: rgba(0,180,50,0.85); }
  #hint {
    position:absolute; top:80px; left:50%; transform:translateX(-50%);
    color:#fff; background:rgba(0,0,0,0.55); padding:9px 18px;
    border-radius:20px; font-size:13px; text-align:center; max-width:85%;
  }
  #controls {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; justify-content:center; gap:12px;
    padding:16px 20px max(20px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    pointer-events:auto;
  }
  button.pill {
    border:none; border-radius:30px; padding:12px 20px;
    font-size:14px; font-weight:600; background:rgba(255,255,255,0.2);
    color:#fff; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); cursor: pointer;
  }
  button.pill.active { background:#c9a13a; color:#2a2320; }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a id="home" href="index.html">&larr; Home</a>
    <div id="status">🎯 Point at HIRO marker</div>
  </div>
  <div id="hint">🔍 Scan the printed square HIRO marker pattern</div>
  <div id="controls">
    <button id="audioBtn" class="pill" onclick="toggleAudio()">🔊 Sound: Off</button>
    <button id="infoBtn" class="pill" onclick="toggleInfo()">ℹ️ Artifact Info</button>
    <button id="spinBtn" class="pill active" onclick="toggleSpin()">🔄 Auto-Rotate</button>
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="alpha: true; antialias: true; colorManagement: true;"
  arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
>
  <a-assets>
    <a-asset-item id="vase-model" src="assets/models/vase.glb"></a-asset-item>
    <!-- Audio element with crossOrigin & WebKit iOS attributes -->
    <audio id="heritageSound" src="assets/audio/mask-narration.mp3" preload="auto" playsinline webkit-playsinline></audio>
  </a-assets>

  <!-- MARKER TRACKING -->
  <a-marker id="hiroMarker" preset="hiro" emitevents="true">
    
    <!-- Base Indicator Ring -->
    <a-ring radius-inner="0.30" radius-outer="0.40" 
            rotation="-90 0 0" 
            material="color:#c9a13a; opacity:0.6; transparent:true">
    </a-ring>

    <!-- Heritage Artifact Model -->
    <a-entity id="artifact"
              gltf-model="#vase-model"
              position="0 0.1 0"
              scale="0.25 0.25 0.25"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
    </a-entity>

    <!-- Info Label -->
    <a-text id="infoText" 
            value="🏺 Heritage Porcelain Vase\nClassic Ceramic Craftsmanship" 
            color="#f4ecdc" align="center" width="2.5" 
            position="0 0.8 0" visible="false">
    </a-text>

    <!-- Lighting -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const marker    = document.querySelector('#hiroMarker');
const status    = document.querySelector('#status');
const hint      = document.querySelector('#hint');
const infoText  = document.querySelector('#infoText');
const infoBtn   = document.querySelector('#infoBtn');
const spinBtn   = document.querySelector('#spinBtn');
const audioBtn  = document.querySelector('#audioBtn');
const artifact  = document.querySelector('#artifact');
const sound     = document.querySelector('#heritageSound');

let infoVisible  = false;
let rotating     = true;
let audioEnabled = false;
let isMarkerFound = false;

// iOS Camera Stream Video Fix (Inject inline attributes to raw video element)
window.addEventListener('camera-init', () => {
  const video = document.querySelector('video');
  if (video) {
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
  }
});

// Sound Toggle Optimized for iOS WebAudio unlocking
function toggleAudio() {
  audioEnabled = !audioEnabled;
  audioBtn.classList.toggle('active', audioEnabled);

  if (audioEnabled) {
    audioBtn.textContent = '🔊 Sound: On';
    
    // Unlock iOS Audio Context instantly
    sound.play().then(() => {
      if (!isMarkerFound) {
        sound.pause();
        sound.currentTime = 0;
      }
    }).catch(err => {
      console.log('iOS Audio unlock error:', err);
    });
  } else {
    audioBtn.textContent = '🔊 Sound: Off';
    sound.pause();
    sound.currentTime = 0;
  }
}

// Marker Event Handlers
marker.addEventListener('markerFound', () => {
  isMarkerFound = true;
  status.textContent = '✅ Marker detected!';
  status.className = 'found';
  hint.textContent = '🏺 Displaying Porcelain Vase';

  if (audioEnabled) {
    sound.currentTime = 0;
    const playPromise = sound.play();
    if (playPromise !== undefined) {
      playPromise.catch(error => console.log('Autoplay blocked by iOS:', error));
    }
  }
});

marker.addEventListener('markerLost', () => {
  isMarkerFound = false;
  status.textContent = '🎯 Point at HIRO marker';
  status.className = '';
  hint.textContent = '🔍 Scan the printed square HIRO marker pattern';

  if (audioEnabled) {
    sound.pause();
  }
});

function toggleInfo() {
  infoVisible = !infoVisible;
  infoText.setAttribute('visible', infoVisible);
  infoBtn.classList.toggle('active', infoVisible);
}

function toggleSpin() {
  rotating = !rotating;
  spinBtn.classList.toggle('active', rotating);
  if (rotating) {
    artifact.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
  } else {
    artifact.removeAttribute('animation');
  }
}

window.toggleAudio = toggleAudio;
window.toggleInfo  = toggleInfo;
window.toggleSpin  = toggleSpin;
</script>
</body>
</html>
