<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Heritage AR Guide — MindAR</title>

<!-- A-Frame & MindAR Libraries -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    width: 100% !important; 
    height: 100% !important; 
    overflow: hidden !important; 
    background: #000; 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    position: fixed;
    inset: 0;
  }

  video, canvas {
    width: 100vw !important;
    height: 100vh !important;
    top: 0 !important;
    left: 0 !important;
    object-fit: cover !important;
    position: absolute !important;
    margin: 0 !important;
  }

  #ui { position: fixed; inset: 0; z-index: 20; pointer-events: none; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
  }
  #home {
    pointer-events: auto; color: #fff; text-decoration: none;
    background: rgba(0,0,0,0.55); padding: 9px 16px; border-radius: 25px;
    font-size: 14px; font-weight: 600;
  }
  #status {
    color: #fff; background: rgba(0,0,0,0.55); padding: 9px 16px;
    border-radius: 25px; font-size: 13px; font-weight: 600;
  }
  #status.found { background: rgba(0,180,50,0.85); }
  #hint {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    color: #fff; background: rgba(0,0,0,0.55); padding: 9px 18px;
    border-radius: 20px; font-size: 13px; text-align: center; max-width: 85%;
  }
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px;
    padding: 16px 20px max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    pointer-events: auto;
  }
  button.pill {
    border: none; border-radius: 30px; padding: 12px 20px;
    font-size: 14px; font-weight: 600; background: rgba(255,255,255,0.2);
    color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer;
  }
  button.pill.active { background: #c9a13a; color: #2a2320; }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a id="home" href="index.html">&larr; Home</a>
    <div id="status">🎯 Scan custom image</div>
  </div>
  <div id="hint">🔍 Point camera at your custom photo</div>
  <div id="controls">
    <button id="audioBtn" class="pill" onclick="toggleAudio()">🔊 Sound: Off</button>
    <button id="infoBtn" class="pill" onclick="toggleInfo()">ℹ️ Artifact Info</button>
    <button id="spinBtn" class="pill active" onclick="toggleSpin()">🔄 Auto-Rotate</button>
  </div>
</div>

<a-scene
  mindar-image="imageTargetSrc: assets/targets/targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <a-asset-item id="vase-model" src="assets/models/vase.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
    <a-ring radius-inner="0.30" radius-outer="0.40" 
            rotation="0 0 0" 
            material="color:#c9a13a; opacity:0.6; transparent:true">
    </a-ring>

    <a-entity id="artifact"
              gltf-model="#vase-model"
              position="0 0 0.1"
              scale="0.25 0.25 0.25"
              rotation="90 0 0"
              animation="property: rotation; to: 90 360 0; loop: true; dur: 12000; easing: linear">
    </a-entity>

    <a-text id="infoText" 
            value="🏺 Heritage Porcelain Vase\nClassic Ceramic Craftsmanship" 
            color="#f4ecdc" align="center" width="2.5" 
            position="0 0.8 0" visible="false">
    </a-text>

    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
  </a-entity>
</a-scene>

<script>
const targetEntity = document.querySelector('#targetEntity');
const status       = document.querySelector('#status');
const hint         = document.querySelector('#hint');
const infoText     = document.querySelector('#infoText');
const infoBtn      = document.querySelector('#infoBtn');
const spinBtn      = document.querySelector('#spinBtn');
const audioBtn     = document.querySelector('#audioBtn');
const artifact     = document.querySelector('#artifact');

// Initialize HTML5 Audio
const sound = new Audio('assets/audio/vase-narration.mp3');
sound.preload = 'auto';

let infoVisible   = false;
let rotating      = true;
let audioEnabled  = false;
let isMarkerFound = false;

// Universal Audio Play Helper
function playNarration() {
  sound.currentTime = 0;
  const promise = sound.play();
  if (promise !== undefined) {
    promise.catch(err => console.log("Audio playback blocked/waiting:", err));
  }
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  audioBtn.classList.toggle('active', audioEnabled);

  if (audioEnabled) {
    audioBtn.textContent = '🔊 Sound: On';

    // Silent priming step: Unlocks iOS media playback without interrupting flow
    sound.play().then(() => {
      if (!isMarkerFound) {
        sound.pause();
      } else {
        playNarration();
      }
    }).catch(err => console.log("Unlock error:", err));

  } else {
    audioBtn.textContent = '🔊 Sound: Off';
    sound.pause();
    sound.currentTime = 0;
  }
}

// MindAR Target Found Event
targetEntity.addEventListener("targetFound", () => {
  isMarkerFound = true;
  status.textContent = '✅ Image detected!';
  status.className = 'found';
  hint.textContent = '🏺 Displaying Porcelain Vase';

  if (audioEnabled) {
    playNarration();
  }
});

// MindAR Target Lost Event
targetEntity.addEventListener("targetLost", () => {
  isMarkerFound = false;
  status.textContent = '🎯 Scan custom image';
  status.className = '';
  hint.textContent = '🔍 Point camera at your custom photo';

  sound.pause();
});

function toggleInfo() {
  infoVisible = !infoVisible;
  infoText.setAttribute('visible', infoVisible);
  infoBtn.classList.toggle('active', infoVisible);
}

function toggleSpin() {
  rotating = !rotating;
  spinBtn.classList.toggle('active', rotating);
  if (rotating) {
    artifact.setAttribute('animation', 'property: rotation; to: 90 360 0; loop: true; dur: 12000; easing: linear');
  } else {
    artifact.removeAttribute('animation');
  }
}

window.toggleAudio = toggleAudio;
window.toggleInfo  = toggleInfo;
window.toggleSpin  = toggleSpin;
</script>
</body>
</html>
