<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Marker Mode</title>

<!-- A-Frame + AR.js — using the version pairing AR.js's own docs recommend.
     The old jsdelivr ar.js@2.2.4 build has known detection bugs with
     newer A-Frame versions. This raw.githack build tracks the latest
     stable AR.js release and is the pairing most tutorials/demos use. -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
  :root{ --maroon:#6e1f2a; --gold:#c9a13a; --cream:#f4ecdc; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#000; }

  #ui{
    position:fixed; inset:0; pointer-events:none; z-index:20;
  }
  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(to bottom, rgba(20,10,8,0.55), transparent);
    pointer-events:auto;
  }
  #topbar a{
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(0,0,0,0.35); padding:8px 12px; border-radius:20px;
  }
  #hint{
    color:#fff; font-size:12px; font-weight:500; text-align:right;
    background:rgba(0,0,0,0.35); padding:8px 12px; border-radius:20px;
    max-width:52%;
  }
  #controls{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; justify-content:center; gap:12px;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    pointer-events:auto;
    flex-wrap:wrap;
  }
  button.pill{
    border:none; border-radius:999px; padding:12px 18px;
    background:rgba(255,255,255,0.15); color:#fff; font-size:13px; font-weight:600;
    backdrop-filter: blur(8px);
    cursor:pointer;
    transition:all 0.3s;
    border:1px solid rgba(255,255,255,0.1);
  }
  button.pill:active{ transform:scale(0.95); }
  button.pill.active{
    background:var(--gold);
    color:#2a2320;
    border-color:var(--gold);
  }

  #not-found-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.7); color:#fff; padding:20px 24px; border-radius:12px;
    font-size:14px; text-align:center; max-width:80%; display:none; pointer-events:none;
    border:2px solid var(--gold);
  }
  #not-found-msg .small{ font-size:12px; color:var(--gold); margin-top:6px; display:block; }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">← Home</a>
    <div id="hint">🎯 Point at Hiro marker</div>
  </div>

  <div id="controls">
    <button class="pill active" id="audioBtn" onclick="toggleAudio()">🔊 Narration on</button>
    <button class="pill" id="infoBtn" onclick="toggleInfo()">ℹ️ Artifact info</button>
    <button class="pill" onclick="resetScene()">↺ Reset</button>
  </div>

  <div id="not-found-msg">
    🔍 Show the HIRO marker on your screen
    <span class="small">Keep the full square in frame, printed on paper works best</span>
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; alpha: true"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960;"
>

  <a-assets>
    <!-- Narration Audio -->
    <audio id="narration" src="assets/audio/mask-narration.mp3" preload="auto"></audio>
  </a-assets>

  <a-marker preset="hiro" id="hiroMarker" emitevents="true" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

    <!-- ========================================= -->
    <!-- 3D Mask using Simple Geometry              -->
    <!-- (No external model file needed)           -->
    <!-- ========================================= -->
    <a-entity
      id="artifact"
      position="0 0.5 0"
      scale="0.2 0.2 0.2"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
    >
      <!-- Face shape (flat oval) -->
      <a-entity position="0 0 0">
        <a-entity geometry="primitive: sphere; radius: 0.3; segmentsHeight: 4; segmentsWidth: 6;"
                  material="color: #8B4513; roughness: 0.5; metalness: 0.3;"
                  position="0 0.05 0" scale="1 1.1 0.4">
        </a-entity>
        <!-- Eyes -->
        <a-entity geometry="primitive: sphere; radius: 0.06;"
                  material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.3;"
                  position="-0.15 0.1 0.15">
        </a-entity>
        <a-entity geometry="primitive: sphere; radius: 0.06;"
                  material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.3;"
                  position="0.15 0.1 0.15">
        </a-entity>
        <!-- Mouth -->
        <a-entity geometry="primitive: torus; radius: 0.08; tube: 0.02; thetaStart: 0; thetaLength: 180;"
                  material="color: #8B0000;"
                  position="0 -0.1 0.15" rotation="90 0 0">
        </a-entity>
        <!-- Nose -->
        <a-entity geometry="primitive: cone; radius: 0.04; height: 0.08;"
                  material="color: #A0522D;"
                  position="0 -0.02 0.18" rotation="90 0 0">
        </a-entity>
        <!-- Head decorations -->
        <a-entity geometry="primitive: cylinder; radius: 0.04; height: 0.15;"
                  material="color: #FF6B6B;"
                  position="0 0.25 0.05" rotation="90 0 0">
        </a-entity>
        <a-entity geometry="primitive: sphere; radius: 0.06;"
                  material="color: #FFD700;"
                  position="0 0.32 0.05">
        </a-entity>
      </a-entity>

      <a-light type="point" intensity="0.9" position="0 1.2 0.6" color="#ffe6b0"></a-light>
    </a-entity>

    <!-- ========================================= -->
    <!-- Info Label                                -->
    <!-- ========================================= -->
    <a-text id="infoText"
      value="🎭 Raksha Mask — Kandyan tradition, 19th c. replica."
      color="#f4ecdc" align="center" width="3" position="0 1.3 0" visible="false"
      background="true" background-color="rgba(0,0,0,0.75)" border-radius="0.1" padding="0.2 0.3"
      font-size="0.8"
    ></a-text>

    <!-- Lighting -->
    <a-light type="ambient" intensity="0.6" color="#ffffff"></a-light>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  var marker = document.querySelector('#hiroMarker');
  var notFoundMsg = document.querySelector('#not-found-msg');
  var narration = document.querySelector('#narration');
  var infoText = document.querySelector('#infoText');
  var audioBtn = document.querySelector('#audioBtn');
  var infoBtn = document.querySelector('#infoBtn');

  var audioOn = true;
  var infoOn = false;
  var hasPlayed = false;
  var visible = false;

  // Marker Found - Play Narration
  marker.addEventListener('markerFound', function() {
    visible = true;
    notFoundMsg.style.display = 'none';
    document.getElementById('hint').textContent = '✅ Artifact detected!';

    if (audioOn && !hasPlayed) {
      narration.currentTime = 0;
      narration.play().catch(function(err) {
        console.log('Audio autoplay blocked. User interaction needed.');
      });
      hasPlayed = true;
    }
  });

  marker.addEventListener('markerLost', function() {
    visible = false;
    document.getElementById('hint').textContent = '🎯 Point at Hiro marker';
  });

  setTimeout(function() {
    if (!visible) {
      notFoundMsg.style.display = 'block';
    }
  }, 3000);

  function toggleAudio() {
    audioOn = !audioOn;
    audioBtn.textContent = audioOn ? '🔊 Narration on' : '🔇 Narration off';
    audioBtn.classList.toggle('active', audioOn);
    if (!audioOn) {
      narration.pause();
    } else if (visible && !hasPlayed) {
      narration.currentTime = 0;
      narration.play().catch(function(err) {});
      hasPlayed = true;
    }
  }

  function toggleInfo() {
    infoOn = !infoOn;
    infoText.setAttribute('visible', infoOn);
    infoBtn.classList.toggle('active', infoOn);
  }

  function resetScene() {
    hasPlayed = false;
    narration.pause();
    narration.currentTime = 0;
    infoOn = false;
    infoText.setAttribute('visible', false);
    infoBtn.classList.remove('active');
    audioBtn.classList.add('active');
    audioOn = true;
    audioBtn.textContent = '🔊 Narration on';
  }

  window.toggleAudio = toggleAudio;
  window.toggleInfo = toggleInfo;
  window.resetScene = resetScene;
</script>
</body>
</html>
