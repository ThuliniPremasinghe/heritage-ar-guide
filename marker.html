<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Marker-Based AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.4/aframe/build/aframe-ar.min.js"></script>
<style>
  *{margin:0;padding:0;}
  body{overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;}
  #ui{
    position:fixed;inset:0;pointer-events:none;z-index:20;
  }
  #topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:16px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    pointer-events:auto;
  }
  #topbar a{
    color:#fff;text-decoration:none;font-size:14px;font-weight:600;
    background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:20px;
  }
  #status{
    color:#fff;font-size:13px;
    background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:20px;
  }
  #controls{
    position:absolute;bottom:0;left:0;right:0;
    display:flex;justify-content:center;gap:12px;
    padding:16px 20px;
    background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    pointer-events:auto;
  }
  button{
    border:none;border-radius:30px;padding:10px 20px;
    font-size:13px;font-weight:600;
    background:rgba(255,255,255,0.2);color:#fff;
    backdrop-filter:blur(8px);cursor:pointer;
  }
  button.active{
    background:#c9a13a;color:#2a2320;
  }
  button:active{transform:scale(0.95);}
  #hint{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#fff;background:rgba(0,0,0,0.7);
    padding:12px 24px;border-radius:12px;font-size:14px;
    text-align:center;display:none;pointer-events:none;max-width:80%;
  }
</style>
</head>
<body>
<div id="ui">
  <div id="topbar">
    <a href="index.html">← Home</a>
    <span id="status">🎯 Point at HIRO marker</span>
  </div>
  <div id="hint">🔍 Place the HIRO marker in view</div>
  <div id="controls">
    <button id="infoBtn" onclick="toggleInfo()">ℹ️ Show Info</button>
    <button id="spinBtn" class="active" onclick="toggleSpin()">🔄 Auto-Rotate</button>
  </div>
</div>

<a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; matrixCodeType: 3x3;">
  <a-marker preset="hiro" id="hiroMarker">
    <!-- Temple Model from CDN -->
    <a-entity 
      gltf-model="https://cdn.jsdelivr.net/gh/aframe-models/aframe-models@latest/gltf/archaeological-temple/temple.gltf"
      position="0 0 0"
      scale="0.3 0.3 0.3"
      rotation="-90 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
    >
      <a-light type="point" color="#ffaa55" intensity="0.8" position="0 1 0"></a-light>
    </a-entity>
    
    <!-- Info Text -->
    <a-text 
      id="infoText"
      value="🏛️ Ancient Temple · UNESCO Heritage Site · 5th Century"
      color="#f4ecdc"
      align="center"
      width="3"
      position="0 -0.4 0"
      visible="false"
      background="true"
      background-color="rgba(0,0,0,0.7)"
      border-radius="0.1"
      padding="0.2 0.3"
    ></a-text>

    <a-light type="ambient" intensity="0.6"></a-light>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
  const marker = document.querySelector('#hiroMarker');
  const hint = document.querySelector('#hint');
  const infoText = document.querySelector('#infoText');
  const infoBtn = document.querySelector('#infoBtn');
  let infoVisible = false;
  let spinning = true;
  let markerFound = false;

  marker.addEventListener('markerFound', () => {
    markerFound = true;
    hint.style.display = 'none';
    document.getElementById('status').textContent = '✅ Artifact detected!';
  });

  marker.addEventListener('markerLost', () => {
    markerFound = false;
    document.getElementById('status').textContent = '🎯 Point at HIRO marker';
    setTimeout(() => {
      if (!markerFound) hint.style.display = 'block';
    }, 3000);
  });

  setTimeout(() => {
    if (!markerFound) hint.style.display = 'block';
  }, 2000);

  function toggleInfo() {
    infoVisible = !infoVisible;
    infoText.setAttribute('visible', infoVisible);
    infoBtn.classList.toggle('active', infoVisible);
  }

  function toggleSpin() {
    spinning = !spinning;
    const artifact = document.querySelector('a-marker a-entity');
    const btn = document.querySelector('#spinBtn');
    btn.classList.toggle('active', spinning);
    if (spinning) {
      artifact.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
    } else {
      artifact.removeAttribute('animation');
    }
  }

  window.toggleInfo = toggleInfo;
  window.toggleSpin = toggleSpin;
</script>
</body>
</html>
