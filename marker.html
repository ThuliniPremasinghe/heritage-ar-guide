<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Marker Mode</title>

<!-- A-Frame + AR.js -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.4/aframe/build/aframe-ar.min.js"></script>

<style>
  *{margin:0;padding:0;}
  body{overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;}
  #ui{
    position:fixed;inset:0;pointer-events:none;z-index:20;
  }
  #topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:16px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    pointer-events:auto;
  }
  #topbar a{
    color:#fff;text-decoration:none;font-size:14px;font-weight:600;
    background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:20px;
  }
  #status{
    color:#fff;font-size:13px;
    background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:20px;
  }
  #controls{
    position:absolute;bottom:0;left:0;right:0;
    display:flex;justify-content:center;gap:12px;
    padding:16px 20px;
    background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    pointer-events:auto;
  }
  button{
    border:none;border-radius:30px;padding:10px 20px;
    font-size:13px;font-weight:600;
    background:rgba(255,255,255,0.2);color:#fff;
    backdrop-filter:blur(8px);cursor:pointer;
    transition:all 0.3s;
  }
  button:active{transform:scale(0.95);}
  button.active{
    background:#c9a13a;color:#2a2320;
  }
  #hint{
    position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
    color:#fff;background:rgba(0,0,0,0.7);
    padding:10px 20px;border-radius:12px;font-size:13px;
    text-align:center;pointer-events:none;max-width:80%;
  }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">← Home</a>
    <span id="status">🎯 Point at HIRO marker</span>
  </div>
  <div id="hint">🔍 Show the HIRO marker to see the artifact</div>
  <div id="controls">
    <button id="infoBtn" onclick="toggleInfo()">ℹ️ Artifact info</button>
    <button id="spinBtn" class="active" onclick="toggleSpin()">🔄 Auto-Rotate</button>
  </div>
</div>

<a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; matrixCodeType: 3x3;">
  
  <a-marker preset="hiro" id="hiroMarker">

    <!-- ========================================== -->
    <!-- RAKSHA MASK - Made with geometry shapes    -->
    <!-- ========================================== -->
    <a-entity 
      id="artifact"
      position="0 0.5 0"
      scale="0.2 0.2 0.2"
    >
      <!-- Base face - flattened sphere -->
      <a-entity 
        geometry="primitive: sphere; radius: 0.35; segmentsHeight: 4; segmentsWidth: 8;" 
        material="color: #8B4513; roughness: 0.6; metalness: 0.3;"
        position="0 0.05 0" 
        scale="1 1.1 0.35"
      ></a-entity>

      <!-- Eyes - gold -->
      <a-entity 
        geometry="primitive: sphere; radius: 0.07;" 
        material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.4;"
        position="-0.15 0.1 0.15"
      ></a-entity>
      <a-entity 
        geometry="primitive: sphere; radius: 0.07;" 
        material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.4;"
        position="0.15 0.1 0.15"
      ></a-entity>

      <!-- Pupils - dark -->
      <a-entity 
        geometry="primitive: sphere; radius: 0.03;" 
        material="color: #1a1a1a;"
        position="-0.15 0.1 0.2"
      ></a-entity>
      <a-entity 
        geometry="primitive: sphere; radius: 0.03;" 
        material="color: #1a1a1a;"
        position="0.15 0.1 0.2"
      ></a-entity>

      <!-- Mouth - red smile -->
      <a-entity 
        geometry="primitive: torus; radius: 0.09; tube: 0.025; thetaStart: 0; thetaLength: 180;" 
        material="color: #8B0000; emissive: #660000; emissiveIntensity: 0.2;"
        position="0 -0.08 0.15" 
        rotation="90 0 0"
      ></a-entity>

      <!-- Nose -->
      <a-entity 
        geometry="primitive: cone; radius: 0.04; height: 0.08;" 
        material="color: #A0522D;"
        position="0 -0.01 0.2" 
        rotation="90 0 0"
      ></a-entity>

      <!-- Traditional decorations - top -->
      <a-entity 
        geometry="primitive: cylinder; radius: 0.02; height: 0.2;" 
        material="color: #FF6B6B;"
        position="0 0.3 0.08" 
        rotation="90 0 0"
      ></a-entity>
      <a-entity 
        geometry="primitive: sphere; radius: 0.07;" 
        material="color: #FFD700; emissive: #FFD700; emissiveIntensity: 0.2;"
        position="0 0.4 0.08"
      ></a-entity>

      <!-- Side decorations -->
      <a-entity 
        geometry="primitive: sphere; radius: 0.05;" 
        material="color: #FF6B6B;"
        position="-0.25 0.15 0.08"
      ></a-entity>
      <a-entity 
        geometry="primitive: sphere; radius: 0.05;" 
        material="color: #FF6B6B;"
        position="0.25 0.15 0.08"
      ></a-entity>

      <!-- Bottom decoration -->
      <a-entity 
        geometry="primitive: cylinder; radius: 0.03; height: 0.08;" 
        material="color: #FFD700;"
        position="0 -0.2 0.08" 
        rotation="0 0 0"
      ></a-entity>

      <!-- Lighting -->
      <a-light type="point" intensity="1.0" position="0 1.5 0.8" color="#ffe6b0"></a-light>
    </a-entity>

    <!-- ========================================== -->
    <!-- ROTATION ANIMATION                        -->
    <!-- ========================================== -->
    <a-animation
      attribute="rotation"
      to="0 360 0"
      loop="true"
      dur="12000"
      easing="linear"
      target="#artifact"
    ></a-animation>

    <!-- ========================================== -->
    <!-- INFO TEXT - Hidden by default             -->
    <!-- ========================================== -->
    <a-text 
      id="infoText"
      value="🎭 Raksha Mask — Kandyan tradition, 19th c. replica."
      color="#f4ecdc"
      align="center"
      width="3"
      position="0 1.2 0"
      visible="false"
      background="true"
      background-color="rgba(0,0,0,0.8)"
      border-radius="0.1"
      padding="0.2 0.3"
      font-size="0.7"
    ></a-text>

    <!-- Decorative ring under artifact -->
    <a-ring
      radius-inner="0.4"
      radius-outer="0.5"
      material="color: #c9a13a; transparent: true; opacity: 0.2; side: double;"
      position="0 0 0"
      rotation="-90 0 0"
    ></a-ring>

    <a-light type="ambient" intensity="0.6" color="#ffffff"></a-light>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  var marker = document.querySelector('#hiroMarker');
  var infoText = document.querySelector('#infoText');
  var infoBtn = document.querySelector('#infoBtn');
  var spinBtn = document.querySelector('#spinBtn');
  var statusEl = document.querySelector('#status');
  var hintEl = document.querySelector('#hint');
  var infoOn = false;
  var spinning = true;
  var markerFound = false;

  // Marker found
  marker.addEventListener('markerFound', function() {
    markerFound = true;
    statusEl.textContent = '✅ Artifact detected!';
    hintEl.textContent = '🎭 Raksha Mask is visible!';
  });

  // Marker lost
  marker.addEventListener('markerLost', function() {
    markerFound = false;
    statusEl.textContent = '🎯 Point at HIRO marker';
    hintEl.textContent = '🔍 Show the HIRO marker to see the artifact';
  });

  // Toggle info text
  function toggleInfo() {
    infoOn = !infoOn;
    infoText.setAttribute('visible', infoOn);
    infoBtn.classList.toggle('active', infoOn);
  }

  // Toggle auto-rotation
  function toggleSpin() {
    spinning = !spinning;
    spinBtn.classList.toggle('active', spinning);
    var artifact = document.querySelector('#artifact');
    var animation = document.querySelector('a-animation');
    
    if (spinning) {
      animation.setAttribute('enabled', 'true');
    } else {
      animation.setAttribute('enabled', 'false');
    }
  }

  // Expose functions
  window.toggleInfo = toggleInfo;
  window.toggleSpin = toggleSpin;

  console.log('🏛️ Heritage AR Guide - Marker Mode with Raksha Mask');
</script>
</body>
</html>
