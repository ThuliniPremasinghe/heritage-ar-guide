<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Marker Mode</title>

<!-- A-Frame + AR.js (marker-based tracking) -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.4/aframe/build/aframe-ar.min.js"></script>

<style>
  :root{ --maroon:#6e1f2a; --gold:#c9a13a; --cream:#f4ecdc; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; font-family:'Inter',sans-serif; }

  #ui{
    position:fixed; inset:0; pointer-events:none; z-index:20;
  }
  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(to bottom, rgba(20,10,8,0.55), transparent);
    pointer-events:auto;
  }
  #topbar a{
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(0,0,0,0.35); padding:8px 12px; border-radius:20px;
  }
  #hint{
    color:#fff; font-size:12px; font-weight:500; text-align:right;
    background:rgba(0,0,0,0.35); padding:8px 12px; border-radius:20px;
    max-width:52%;
  }
  #controls{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; justify-content:center; gap:12px;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    pointer-events:auto;
  }
  button.pill{
    border:none; border-radius:999px; padding:12px 18px;
    background:rgba(0,0,0,0.55); color:#fff; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:8px; backdrop-filter: blur(6px);
    cursor:pointer;
  }
  button.pill:active{ background:rgba(0,0,0,0.75); }
  button.pill.active{ background:var(--gold); color:#2a2320; }

  #not-found-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.7); color:#fff; padding:16px 24px; border-radius:12px;
    font-size:14px; text-align:center; max-width:80%; display:none; pointer-events:none;
    border:2px solid var(--gold);
  }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">← Home</a>
    <div id="hint">Point your camera at the Hiro marker on screen</div>
  </div>

  <div id="controls">
    <button class="pill active" id="infoBtn" onclick="toggleInfo()">ℹ️ Artifact info</button>
    <button class="pill" id="spinBtn" onclick="toggleSpin()">🔄 Auto-Rotate</button>
  </div>

  <div id="not-found-msg">🔍 Show the HIRO marker on your screen<br><span style="font-size:12px;color:#c9a13a;">Keep the full square in frame</span></div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; alpha: true"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; matrixCodeType: 3x3;"
>

  <a-marker preset="hiro" id="hiroMarker" emitevents="true">

    <!-- Main Artifact - Temple from CDN -->
    <a-entity 
      gltf-model="https://cdn.jsdelivr.net/gh/aframe-models/aframe-models@latest/gltf/archaeological-temple/temple.gltf"
      position="0 0 0"
      scale="0.3 0.3 0.3"
      rotation="-90 0 0"
      id="artifact"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear"
    >
      <a-light type="point" intensity="0.9" position="0 1.2 0.6" color="#ffe6b0"></a-light>
    </a-entity>

    <!-- Second Artifact - Statue -->
    <a-entity 
      gltf-model="https://cdn.jsdelivr.net/gh/aframe-models/aframe-models@latest/gltf/statue/statue.gltf"
      position="0.6 0 0.3"
      scale="0.15 0.15 0.15"
      rotation="0 45 0"
      animation="property: position; to: 0.6 0.1 0.3; loop: true; dir: alternate; dur: 2000; easing: easeInOutQuad"
    ></a-entity>

    <!-- Info Text -->
    <a-text id="infoText" value="🏛️ Ancient Temple & Statue · UNESCO Heritage Site" color="#f4ecdc"
      align="center" width="3" position="0 -0.4 0" visible="false"
      background="true" background-color="rgba(0,0,0,0.7)" border-radius="0.1" padding="0.2 0.3">
    </a-text>

    <a-light type="ambient" intensity="0.6" color="#ffffff"></a-light>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  var marker = document.querySelector('#hiroMarker');
  var notFoundMsg = document.querySelector('#not-found-msg');
  var infoText = document.querySelector('#infoText');
  var infoBtn = document.querySelector('#infoBtn');
  var spinBtn = document.querySelector('#spinBtn');
  var infoOn = false;
  var spinning = true;
  var visible = false;

  marker.addEventListener('markerFound', function() {
    visible = true;
    notFoundMsg.style.display = 'none';
    document.getElementById('hint').textContent = '✅ Artifact detected!';
  });

  marker.addEventListener('markerLost', function() {
    visible = false;
    document.getElementById('hint').textContent = 'Point your camera at the Hiro marker on screen';
  });

  // Show message if marker not found after 3 seconds
  setTimeout(function() {
    if (!visible) notFoundMsg.style.display = 'block';
  }, 3000);

  function toggleInfo() {
    infoOn = !infoOn;
    infoText.setAttribute('visible', infoOn);
    infoBtn.classList.toggle('active', infoOn);
  }

  function toggleSpin() {
    spinning = !spinning;
    var artifact = document.querySelector('#artifact');
    spinBtn.classList.toggle('active', spinning);
    if (spinning) {
      artifact.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
    } else {
      artifact.removeAttribute('animation');
    }
  }

  window.toggleInfo = toggleInfo;
  window.toggleSpin = toggleSpin;
</script>
</body>
</html>
