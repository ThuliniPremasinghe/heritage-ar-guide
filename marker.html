<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Heritage AR Guide — Marker AR</title>

<!--
  INTE 42312 requirement mapping (marker-based tracking requirement):
  A-Frame 1.6.0 + AR.js 3.4.7 is the officially documented compatible pairing.
-->
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Inter',Arial,sans-serif; }
  a-scene { position:fixed; inset:0; z-index:1; }

  #ui { position:fixed; inset:0; z-index:20; pointer-events:none; }

  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding: max(16px, env(safe-area-inset-top)) 16px 16px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
  }
  #home {
    pointer-events:auto; color:#fff; text-decoration:none;
    background:rgba(0,0,0,0.55); padding:9px 16px; border-radius:25px;
    font-size:14px; font-weight:600;
  }
  #status {
    color:#fff; background:rgba(0,0,0,0.55); padding:9px 16px;
    border-radius:25px; font-size:13px; font-weight:600;
  }
  #hint {
    position:absolute; top:75px; left:50%; transform:translateX(-50%);
    color:#fff; background:rgba(0,0,0,0.55); padding:9px 18px;
    border-radius:20px; font-size:13px; text-align:center;
  }
  #controls {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; justify-content:center; gap:12px;
    padding:16px 20px max(20px, env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(0,0,0,0.65), transparent);
    pointer-events:auto;
  }
  button.pill {
    border:none; border-radius:30px; padding:12px 20px;
    font-size:14px; font-weight:600; background:rgba(255,255,255,0.18);
    color:#fff; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  button.pill.active { background:#c9a13a; color:#2a2320; }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a id="home" href="index.html">&larr; Home</a>
    <div id="status">🎯 Point at HIRO marker</div>
  </div>
  <div id="hint">🔍 Show the printed HIRO marker to see the artifact</div>
  <div id="controls">
    <button id="infoBtn" class="pill" onclick="toggleInfo()">ℹ️ Artifact Info</button>
    <button id="spinBtn" class="pill active" onclick="toggleSpin()">🔄 Auto-Rotate</button>
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="alpha: true; antialias: true; colorManagement: true"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
>

  <a-assets>
    <a-asset-item id="vase-model" src="assets/models/vase.glb"></a-asset-item>
  </a-assets>

  <a-marker id="hiroMarker" preset="hiro" emitevents="true" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="5">

    <!-- Model 1 of 2: real, downloaded .glb — adjust the scale value
         below once you see it render; start here and tweak up/down. -->
    <a-entity id="artifact"
              gltf-model="#vase-model"
              position="0 0 0"
              scale="0.3 0.3 0.3"
              shadow="cast: true">
    </a-entity>

    <a-text id="infoText" value="Porcelain Vase — Heritage Collection" color="#f4ecdc"
            align="center" width="3" position="0 -0.45 0" visible="false"></a-text>

    <a-ring radius-inner="0.4" radius-outer="0.5" position="0 0 0" rotation="-90 0 0"
            material="color:#c9a13a; opacity:0.35; transparent:true; side:double"></a-ring>

    <a-light type="ambient" intensity="1" color="#ffffff"></a-light>
    <a-light type="point" intensity="1.2" position="0 1.5 1" color="#ffe6b0"></a-light>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
const marker   = document.querySelector('#hiroMarker');
const status   = document.querySelector('#status');
const hint     = document.querySelector('#hint');
const infoText = document.querySelector('#infoText');
const infoBtn  = document.querySelector('#infoBtn');
const spinBtn  = document.querySelector('#spinBtn');
const artifact = document.querySelector('#artifact');

let infoVisible = false;
let rotating = true;

// Log load success/failure so you can see in the console whether
// vase.glb actually loaded, and what its real size/center looks like.
artifact.addEventListener('model-loaded', (e) => {
  console.log('✅ vase.glb loaded successfully', e.detail.model);
});
artifact.addEventListener('model-error', (e) => {
  console.error('❌ Failed to load vase.glb — check the path assets/models/vase.glb exists', e.detail);
});

marker.addEventListener('markerFound', () => {
  status.textContent = '✅ Marker detected!';
  status.style.background = 'rgba(0,130,50,0.85)';
  hint.textContent = '🏺 Porcelain Vase is visible!';
});

marker.addEventListener('markerLost', () => {
  status.textContent = '🎯 Point at HIRO marker';
  status.style.background = 'rgba(0,0,0,0.55)';
  hint.textContent = '🔍 Show the printed HIRO marker to see the artifact';
});

function toggleInfo() {
  infoVisible = !infoVisible;
  infoText.setAttribute('visible', infoVisible);
  infoBtn.classList.toggle('active', infoVisible);
}

function toggleSpin() {
  rotating = !rotating;
  spinBtn.classList.toggle('active', rotating);
  if (rotating) {
    artifact.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');
  } else {
    artifact.removeAttribute('animation');
  }
}

artifact.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear');

window.toggleInfo = toggleInfo;
window.toggleSpin = toggleSpin;
</script>
</body>
</html>
