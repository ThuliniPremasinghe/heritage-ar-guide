<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Marker-Based AR</title>

<!-- A-Frame + AR.js -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.4/aframe/build/aframe-ar.min.js"></script>

<style>
  body{margin:0;overflow:hidden;font-family:'Segoe UI',sans-serif;}
  #ui{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    pointer-events:none;
    z-index:10;
  }
  #topbar{
    display:flex;
    justify-content:space-between;
    padding:16px 20px;
    background:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent);
  }
  #topbar a{
    color:white;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    background:rgba(0,0,0,0.4);
    padding:8px 16px;
    border-radius:20px;
    pointer-events:auto;
  }
  #hint{
    color:white;
    font-size:12px;
    background:rgba(0,0,0,0.5);
    padding:6px 14px;
    border-radius:20px;
  }
  #controls{
    position:absolute;
    bottom:20px;
    left:0;right:0;
    display:flex;
    justify-content:center;
    gap:12px;
    pointer-events:auto;
  }
  button{
    border:none;
    border-radius:30px;
    padding:10px 18px;
    font-size:13px;
    font-weight:600;
    background:rgba(0,0,0,0.6);
    color:white;
    backdrop-filter:blur(8px);
    cursor:pointer;
  }
  button.active{background:#c9a13a;color:#2a2320;}
  #info-text{
    position:absolute;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,0.7);
    padding:10px 20px;
    border-radius:12px;
    font-size:14px;
    display:none;
    text-align:center;
    max-width:80%;
  }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">← Home</a>
    <span id="hint">📷 Point at HIRO marker</span>
  </div>
  <div id="info-text">🏛️ Kandyan Mask - 19th Century Replica</div>
  <div id="controls">
    <button id="infoBtn" onclick="toggleInfo()">ℹ️ Info</button>
    <button id="rotateBtn" onclick="toggleRotation()">🔄 Auto-Rotate</button>
  </div>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;"
>

  <!-- Use public models -->
  <a-assets>
    <!-- Using A-Frame's built-in geometry as fallback since GLB might not load -->
  </a-assets>

  <a-marker preset="hiro" id="hiroMarker">
    <!-- Main Artifact - Using a torus knot with nice material -->
    <a-entity id="artifact" position="0 0.3 0">
      <a-torus-knot
        radius="0.15"
        tube="0.04"
        p="2"
        q="3"
        material="color:#c9a13a; metalness:0.6; roughness:0.3;"
        animation="property:rotation; to:0 360 0; loop:true; dur:10000; easing:linear"
      ></a-torus-knot>
      <!-- Inner glow -->
      <a-sphere
        radius="0.06"
        material="color:#ffd700; emissive:#ffd700; emissiveIntensity:0.5; transparent:true; opacity:0.6;"
        position="0 0 0"
      ></a-sphere>
    </a-entity>

    <!-- Second Artifact - Small statue -->
    <a-entity position="-0.3 0.15 0.1">
      <a-cylinder
        radius="0.04"
        height="0.08"
        material="color:#6e1f2a; metalness:0.3;"
        position="0 0.04 0"
      ></a-cylinder>
      <a-sphere
        radius="0.04"
        material="color:#f4ecdc;"
        position="0 0.12 0"
      ></a-sphere>
    </a-entity>

    <!-- Decorative particles -->
    <a-entity position="0 0.5 0">
      <a-entity particle-system="preset:snow; color:#ffd700; particleCount:30; size:0.02; speed:0.3;"></a-entity>
    </a-entity>

    <!-- Lighting -->
    <a-light type="point" intensity="1" color="#ffe6b0" position="0 0.6 0.5"></a-light>
    <a-light type="ambient" intensity="0.5"></a-light>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
let infoVisible = false;
let rotateOn = true;

function toggleInfo() {
  infoVisible = !infoVisible;
  const infoText = document.getElementById('info-text');
  infoText.style.display = infoVisible ? 'block' : 'none';
  document.getElementById('infoBtn').classList.toggle('active', infoVisible);
}

function toggleRotation() {
  rotateOn = !rotateOn;
  const artifact = document.querySelector('#artifact');
  if (artifact) {
    if (rotateOn) {
      artifact.setAttribute('animation', 'property:rotation; to:0 360 0; loop:true; dur:10000; easing:linear');
    } else {
      artifact.removeAttribute('animation');
    }
  }
  document.getElementById('rotateBtn').classList.toggle('active', rotateOn);
}

// Show hint if marker not found
setTimeout(() => {
  const hint = document.getElementById('hint');
  if (hint) hint.textContent = '🔍 Move camera to find the HIRO marker';
}, 5000);
</script>
</body>
</html>
