<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width,
     initial-scale=1,
     maximum-scale=1,
     user-scalable=no">

  <title>Heritage AR Guide - Marker AR</title>

  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 15px;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.7),
        transparent
      );
    }

    #home {
      pointer-events: auto;

      color: white;
      text-decoration: none;

      background: rgba(0,0,0,0.6);

      padding: 9px 15px;

      border-radius: 20px;

      font-size: 13px;
      font-weight: bold;
    }

    #status {

      color: white;

      background: rgba(0,0,0,0.6);

      padding: 9px 15px;

      border-radius: 20px;

      font-size: 13px;
      font-weight: bold;
    }

    #bottom {

      position: absolute;

      bottom: 0;
      left: 0;
      right: 0;

      display: flex;

      justify-content: center;

      gap: 10px;

      padding: 20px;

      background: linear-gradient(
        to top,
        rgba(0,0,0,0.7),
        transparent
      );

      pointer-events: auto;
    }

    button {

      border: none;

      border-radius: 25px;

      padding: 12px 20px;

      background: #c9a13a;

      color: #2a2320;

      font-weight: bold;

      font-size: 14px;

      cursor: pointer;
    }

    button.secondary {

      background: rgba(255,255,255,0.2);

      color: white;
    }

  </style>

</head>

<body>

  <!-- User Interface -->

  <div id="ui">

```
<div id="topbar">

  <a id="home" href="index.html">
    ← Home
  </a>

  <div id="status">
    🎯 Looking for Hiro marker...
  </div>

</div>


<div id="bottom">

  <button onclick="toggleInfo()">
    ℹ️ Info
  </button>

  <button
    class="secondary"
    onclick="toggleRotation()">

    🔄 Rotate

  </button>

</div>
```

  </div>

  <!-- AR SCENE -->

<a-scene

```
embedded

vr-mode-ui="enabled: false"

renderer="logarithmicDepthBuffer: true; alpha: true"

arjs="
  sourceType: webcam;
  debugUIEnabled: false;
  detectionMode: mono;
  matrixCodeType: 3x3;
"

loading-screen="
  enabled: false;

```

>

```
<!-- HIRO MARKER -->

<a-marker

  id="hiroMarker"

  preset="hiro"

  emitevents="true"

>


  <!-- Main Heritage Artifact -->

  <a-box

    id="artifact"

    position="0 0.5 0"

    rotation="0 0 0"

    scale="0.7 0.7 0.7"

    color="#8B4513"

  >

  </a-box>



  <!-- Golden Roof -->

  <a-cone

    position="0 1.05 0"

    radius-bottom="0.65"

    radius-top="0"

    height="0.5"

    color="#c9a13a"

  >

  </a-cone>



  <!-- Pillars -->

  <a-cylinder

    position="-0.45 0.25 0"

    radius="0.08"

    height="0.5"

    color="#f4ecdc"

  >

  </a-cylinder>


  <a-cylinder

    position="0.45 0.25 0"

    radius="0.08"

    height="0.5"

    color="#f4ecdc"

  >

  </a-cylinder>



  <!-- Second Artifact -->

  <a-sphere

    id="statue"

    position="0.9 0.35 0"

    radius="0.25"

    color="#6e1f2a"

  >

  </a-sphere>



  <!-- Information -->

  <a-text

    id="infoText"

    value="Ancient Heritage Exhibit"

    align="center"

    color="#f4ecdc"

    width="3"

    position="0 -0.3 0"

    visible="false"

  >

  </a-text>



  <!-- Lighting -->

  <a-light

    type="ambient"

    intensity="1"

    color="#ffffff">

  </a-light>


</a-marker>



<!-- Camera -->

<a-entity camera></a-entity>
```

  </a-scene>

  <script>

    const marker =
      document.querySelector("#hiroMarker");

    const status =
      document.querySelector("#status");

    const artifact =
      document.querySelector("#artifact");

    const infoText =
      document.querySelector("#infoText");


    let rotating = true;

    let showInfo = false;


    // -----------------------------
    // Marker FOUND
    // -----------------------------

    marker.addEventListener(
      "markerFound",
      function () {

        console.log("HIRO MARKER FOUND");

        status.innerHTML =
          "✅ Marker detected!";

        status.style.background =
          "rgba(20,120,50,0.85)";

      }
    );


    // -----------------------------
    // Marker LOST
    // -----------------------------

    marker.addEventListener(
      "markerLost",
      function () {

        console.log("HIRO MARKER LOST");

        status.innerHTML =
          "🎯 Looking for Hiro marker...";

        status.style.background =
          "rgba(0,0,0,0.6)";

      }
    );


    // -----------------------------
    // Toggle information
    // -----------------------------

    function toggleInfo() {

      showInfo = !showInfo;

      infoText.setAttribute(
        "visible",
        showInfo
      );

    }


    // -----------------------------
    // Toggle rotation
    // -----------------------------

    function toggleRotation() {

      rotating = !rotating;

      if (rotating) {

        artifact.setAttribute(
          "animation",
          "property: rotation; " +
          "to: 0 360 0; " +
          "loop: true; " +
          "dur: 5000; " +
          "easing: linear"
        );

      } else {

        artifact.removeAttribute(
          "animation"
        );

      }

    }


    // Start rotation

    artifact.setAttribute(

      "animation",

      "property: rotation; " +
      "to: 0 360 0; " +
      "loop: true; " +
      "dur: 5000; " +
      "easing: linear"

    );


    console.log(
      "Heritage AR Guide started"
    );

  </script>

</body>

</html>
