<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Markerless Mode</title>
<style>
  :root{ --maroon:#6e1f2a; --gold:#c9a13a; --cream:#f4ecdc; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#111; }
  canvas{ display:block; }

  #ui{ position:fixed; inset:0; pointer-events:none; z-index:20; }
  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    pointer-events:auto;
  }
  #topbar a{
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(0,0,0,0.45); padding:8px 14px; border-radius:20px;
  }
  #hint{
    position:absolute; top:65px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:12px; font-weight:500; text-align:center;
    background:rgba(0,0,0,0.65); padding:8px 16px; border-radius:20px;
    pointer-events:none; max-width:85%;
  }
  #controls{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    pointer-events:auto;
  }
  .row{ display:flex; gap:10px; flex-wrap: wrap; justify-content: center; }
  button.pill{
    border:none; border-radius:999px; padding:12px 18px;
    background:rgba(0,0,0,0.65); color:#fff; font-size:13px; font-weight:600;
    backdrop-filter: blur(6px); cursor: pointer;
  }
  button.pill.active{ background:var(--gold); color:#2a2320; }

  #ar-button-holder{
    position:fixed; bottom:110px; left:50%; transform:translateX(-50%);
    z-index:30; pointer-events:auto;
  }

  #not-supported{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(20, 10, 8, 0.92); color:var(--cream); text-align:center; padding:32px; z-index:50;
  }
  #not-supported.show{ display:flex; }
  #not-supported button {
    margin-top: 16px; padding: 10px 20px; border-radius: 20px; border: none;
    background: var(--gold); color: #000; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">&larr; Home</a>
  </div>
  <div id="hint">Initializing AR Session...</div>

  <div id="controls">
    <div class="row">
      <button class="pill active" id="selectVase" onclick="selectArtifact('vase')">🏺 Place: Vase</button>
      <button class="pill" id="selectRoom" onclick="selectArtifact('room')">🏛️ Place: Porcelain Room</button>
    </div>
    <div class="row">
      <button class="pill" onclick="resetPlacedObjects()">↺ Reset Exhibit</button>
    </div>
  </div>
</div>

<div id="ar-button-holder"></div>

<div id="not-supported">
  <div>
    <h2>WebXR AR Not Supported</h2>
    <p style="max-width:40ch; margin:12px auto; line-height: 1.5;">
      WebXR hit-testing requires Google Chrome on an ARCore-compatible Android device.
      You are currently viewing on an unsupported browser or platform (e.g., iOS Safari).
    </p>
    <button onclick="dismissNotSupported()">Continue in 3D Preview Mode</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let currentArtifactType = 'vase';
let selectedForDrag = null;

let camera, scene, renderer;
let controller;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let isARSupported = false;

const placedObjects = [];
const loader = new GLTFLoader();
const modelCache = {};

init();

async function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
  camera.position.set(0, 1.2, 2.5);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lighting Setup
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffe6b0, 1.0);
  dirLight.position.set(0.5, 2, 0.5);
  scene.add(dirLight);

  // Check explicit WebXR Immersive AR Support
  if ('xr' in navigator) {
    try {
      isARSupported = await navigator.xr.isSessionSupported('immersive-ar');
    } catch (e) {
      isARSupported = false;
    }
  }

  if (isARSupported) {
    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('ui') }
    });
    document.getElementById('ar-button-holder').appendChild(arButton);
    updateHint('Tap "START AR" below to begin surface detection');
  } else {
    document.getElementById('not-supported').classList.add('show');
    updateHint('3D Preview Mode (WebXR AR unavailable on this browser)');
  }

  // Hit-Test Placement Reticle
  const reticleGeo = new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2);
  const reticleMat = new THREE.MeshBasicMaterial({ color: 0xc9a13a });
  reticle = new THREE.Mesh(reticleGeo, reticleMat);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // WebXR Controller Event
  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  window.addEventListener('resize', onWindowResize);
  renderer.setAnimationLoop(render);

  // Preload Models
  preloadModel('vase', 'assets/models/vase.glb');
  preloadModel('room', 'assets/models/the_porcelain_room.glb');
}

function preloadModel(key, path) {
  loader.load(
    path,
    (gltf) => {
      modelCache[key] = gltf.scene;
      console.log(`✅ Model loaded: ${path}`);
    },
    undefined,
    (err) => console.error(`❌ Model load error (${path}):`, err)
  );
}

function makePrefab(type) {
  const source = modelCache[type];
  if (!source) {
    updateHint(`⏳ ${type.toUpperCase()} model loading...`);
    return null;
  }
  const group = source.clone(true);
  group.userData.type = type;

  if (type === 'vase') {
    group.scale.set(0.2, 0.2, 0.2);
  } else if (type === 'room') {
    group.scale.set(0.04, 0.04, 0.04);
  }
  return group;
}

window.selectArtifact = function (type) {
  currentArtifactType = type;
  document.getElementById('selectVase').classList.toggle('active', type === 'vase');
  document.getElementById('selectRoom').classList.toggle('active', type === 'room');
};

window.resetPlacedObjects = function () {
  placedObjects.forEach(o => scene.remove(o.mesh));
  placedObjects.length = 0;
  selectedForDrag = null;
  updateHint('Exhibit reset. Tap to place an artifact');
};

window.dismissNotSupported = function () {
  document.getElementById('not-supported').classList.remove('show');
};

function onSelect() {
  if (selectedForDrag) {
    selectedForDrag = null;
    updateHint('Object dropped. Tap to place or move another');
    return;
  }

  const hit = pickPlacedObject();
  if (hit) {
    selectedForDrag = hit;
    updateHint('Dragging object... Move phone and tap to release');
    return;
  }

  if (reticle.visible) {
    const prefab = makePrefab(currentArtifactType);
    if (!prefab) return;

    prefab.position.setFromMatrixPosition(reticle.matrix);
    scene.add(prefab);

    const entry = { mesh: prefab, box3: new THREE.Box3() };
    placedObjects.push(entry);
    updateHint(`Placed ${currentArtifactType.toUpperCase()}`);
  }
}

function pickPlacedObject() {
  if (!reticle.visible || placedObjects.length === 0) return null;
  const reticlePos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
  
  let closest = null;
  let minDistance = 0.25;

  for (const obj of placedObjects) {
    const dist = obj.mesh.position.distanceTo(reticlePos);
    if (dist < minDistance) {
      minDistance = dist;
      closest = obj;
    }
  }
  return closest;
}

function updateCollisions() {
  placedObjects.forEach(o => o.box3.setFromObject(o.mesh));

  placedObjects.forEach(o => {
    let colliding = false;
    for (const other of placedObjects) {
      if (other === o) continue;
      if (o.box3.intersectsBox(other.box3)) {
        colliding = true;
        break;
      }
    }
    setCollisionVisual(o.mesh, colliding);
  });
}

function setCollisionVisual(group, colliding) {
  group.traverse(child => {
    if (!child.isMesh || !child.material) return;
    const materials = Array.isArray(child.material) ? child.material : [child.material];
    materials.forEach(mat => {
      if (colliding) {
        if (mat.userData._origColor === undefined && mat.color) {
          mat.userData._origColor = mat.color.getHex();
        }
        if (mat.color) mat.color.setHex(0xd93c3c);
      } else if (mat.userData._origColor !== undefined && mat.color) {
        mat.color.setHex(mat.userData._origColor);
      }
    });
  });
}

function updateHint(text) {
  document.getElementById('hint').textContent = text;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function render(timestamp, frame) {
  if (frame) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        if (selectedForDrag) {
          selectedForDrag.mesh.position.setFromMatrixPosition(reticle.matrix);
        }
      } else {
        reticle.visible = false;
      }
    }
  }

  updateCollisions();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
