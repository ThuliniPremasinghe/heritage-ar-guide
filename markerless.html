<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Advanced Markerless Mode</title>

<!-- Google Model Viewer Library -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<style>
  :root { --maroon:#6e1f2a; --gold:#c9a13a; --cream:#f4ecdc; }
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#111; }

  model-viewer {
    width: 100vw;
    height: 100vh;
    background-color: #111;
  }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:20; }
  
  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    pointer-events:auto;
  }
  #topbar a {
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(0,0,0,0.45); padding:8px 14px; border-radius:20px;
  }

  #hint {
    position:absolute; top:65px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:12px; font-weight:500; text-align:center;
    background:rgba(0,0,0,0.65); padding:8px 16px; border-radius:20px;
    pointer-events:none; max-width:85%; width: max-content;
  }

  #controls {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    pointer-events:auto;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }
  .row { display:flex; gap:10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  
  button.pill {
    border:none; border-radius:999px; padding:10px 16px;
    background:rgba(0,0,0,0.65); color:#fff; font-size:12px; font-weight:600;
    backdrop-filter: blur(6px); cursor: pointer; border: 1px solid rgba(255,255,255,0.15);
  }
  button.pill.active { background:var(--gold); color:#2a2320; border-color:var(--gold); }

  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 20px;
    color: #fff;
    font-size: 11px;
    backdrop-filter: blur(6px);
  }
  .control-group input[type=range] { width: 70px; }

  #ar-launch-btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    pointer-events: auto;
    background: var(--gold);
    color: #000;
    border: none;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 32px;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  #auto-light-badge {
    position: absolute;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(201, 161, 58, 0.25);
    color: #c9a13a;
    border: 1px solid rgba(201, 161, 58, 0.5);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">&larr; Home</a>
  </div>
  <div id="hint">Loaded Heritage Vase. Tap START AR to place in real space</div>
  <div id="auto-light-badge">💡 Auto Color & Exposure Balancing Active</div>

  <div id="controls">
    <!-- Manual Fine-Tuning Controls for Shadow & Exposure -->
    <div class="row">
      <div class="control-group">
        <label for="shadow">Shadow</label>
        <input type="range" id="shadow" min="0" max="2" step="0.1" value="1" oninput="updateShadow(this.value)">
      </div>
      <div class="control-group">
        <label for="exposure">Exposure</label>
        <input type="range" id="exposure" min="0.5" max="2.5" step="0.1" value="1.2" oninput="updateExposure(this.value)">
      </div>
    </div>
  </div>
</div>

<button id="ar-launch-btn" onclick="triggerAR()">START AR</button>

<!-- 
  MARKERLESS SPATIAL TRACKING & AUTOMATIC COLOR/LIGHTING BALANCING:
  - ar: Enables spatial surface placement
  - tone-mapping="commerce": Maintains true-to-life colors
  - shadow-intensity & shadow-softness: Ground plane realistic shadow
-->
<model-viewer 
  id="viewer"
  src="assets/models/vase.glb"
  ios-src="assets/models/vase.usdz"
  alt="Heritage Porcelain Vase"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  shadow-softness="0.8"
  exposure="1.2"
  tone-mapping="commerce"
  ar-scale="auto">
</model-viewer>

<script>
  const viewer = document.getElementById('viewer');
  const exposureInput = document.getElementById('exposure');

  function triggerAR() {
    if (viewer.canActivateAR) {
      viewer.activateAR();
    } else {
      alert('AR is not supported on this device/browser setup.');
    }
  }

  // --- ADVANCED FEATURE 1: Dynamic Shadow Intensity ---
  function updateShadow(val) {
    viewer.shadowIntensity = val;
  }

  // --- ADVANCED FEATURE 2: Exposure Control ---
  function updateExposure(val) {
    viewer.exposure = val;
  }

  // --- ADVANCED FEATURE 3: AUTOMATIC COLOR & LIGHTING BALANCING ---
  // Automatically detects dark surroundings and increases exposure/brightness dynamically
  function setupAutoLightBalancing() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    canvas.width = 64;
    canvas.height = 64;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();

        setInterval(() => {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            let totalLuminance = 0;
            for (let i = 0; i < data.length; i += 4) {
              // Standard Perceptual Luminance formula
              const r = data[i];
              const g = data[i + 1];
              const b = data[i + 2];
              totalLuminance += (0.299 * r + 0.587 * g + 0.114 * b);
            }

            const avgLuminance = totalLuminance / (canvas.width * canvas.height);
            
            // Invert luminance: Darker rooms (lower luminance) yield higher exposure boosting
            // Range maps between Exposure 0.8 (bright environment) and 2.2 (dark environment)
            const targetExposure = Math.min(Math.max((1 - (avgLuminance / 255)) * 2.2 + 0.5, 0.8), 2.2);
            
            // Smoothly adjust exposure
            viewer.exposure = viewer.exposure + (targetExposure - viewer.exposure) * 0.1;
            exposureInput.value = viewer.exposure.toFixed(1);
          }
        }, 300);
      })
      .catch(err => {
        console.log("Ambient camera balancing fallback active:", err);
      });
  }

  // Initialize auto light balancing on page ready
  window.addEventListener('load', setupAutoLightBalancing);

  // Manage UI state during AR Session
  viewer.addEventListener('ar-status', (event) => {
    const launchBtn = document.getElementById('ar-launch-btn');
    if (event.detail.status === 'session-started') {
      launchBtn.style.display = 'none';
      document.getElementById('hint').textContent = "Scanning surface... Move camera slowly";
    } else if (event.detail.status === 'not-presenting') {
      launchBtn.style.display = 'block';
      document.getElementById('hint').textContent = "Loaded Heritage Vase. Tap START AR to place in real space";
    }
  });
</script>
</body>
</html>
