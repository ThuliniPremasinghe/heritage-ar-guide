<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Advanced Markerless Mode</title>

<!-- Google Model Viewer Library -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<style>
  :root { --maroon:#6e1f2a; --gold:#c9a13a; --cream:#f4ecdc; }
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#111; }

  model-viewer {
    width: 100vw;
    height: 100vh;
    background-color: #111;
  }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:20; }
  
  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    pointer-events:auto;
  }
  #topbar a {
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(0,0,0,0.45); padding:8px 14px; border-radius:20px;
  }

  #hint {
    position:absolute; top:65px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:12px; font-weight:500; text-align:center;
    background:rgba(0,0,0,0.65); padding:8px 16px; border-radius:20px;
    pointer-events:none; max-width:85%; width: max-content;
  }

  #status-badges {
    position: absolute;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    pointer-events: none;
  }

  .badge {
    background: rgba(201, 161, 58, 0.25);
    color: #c9a13a;
    border: 1px solid rgba(201, 161, 58, 0.5);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    backdrop-filter: blur(4px);
  }

  #controls {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    pointer-events:auto;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }
  .row { display:flex; gap:10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  
  button.pill {
    border:none; border-radius:999px; padding:10px 16px;
    background:rgba(0,0,0,0.65); color:#fff; font-size:12px; font-weight:600;
    backdrop-filter: blur(6px); cursor: pointer; border: 1px solid rgba(255,255,255,0.15);
  }
  button.pill.active { background:var(--gold); color:#2a2320; border-color:var(--gold); }

  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 20px;
    color: #fff;
    font-size: 11px;
    backdrop-filter: blur(6px);
  }
  .control-group input[type=range] { width: 70px; }

  #ar-launch-btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    pointer-events: auto;
    background: var(--gold);
    color: #000;
    border: none;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 32px;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">&larr; Home</a>
  </div>
  <div id="hint">Loaded Heritage Vase. Tap START AR to place in real space</div>
  
  <div id="status-badges">
    <div id="api-badge" class="badge">🌐 REST API: Fetching Live Environmental Data...</div>
    <div id="auto-light-badge" class="badge">💡 Auto Color & Exposure Balancing Active</div>
    <div id="pedestal-badge" class="badge">🏛️ Stand: Off (Floor Mode)</div>
  </div>

  <div id="controls">
    <!-- OPTION B: Interactive Pedestal Toggle Row -->
    <div class="row">
      <button class="pill" id="pedestalBtn" onclick="togglePedestal()">🏛️ Toggle Pedestal Base</button>
    </div>

    <!-- Manual Fine-Tuning Controls -->
    <div class="row">
      <div class="control-group">
        <label for="shadow">Shadow</label>
        <input type="range" id="shadow" min="0" max="2" step="0.1" value="1" oninput="updateShadow(this.value)">
      </div>
      <div class="control-group">
        <label for="exposure">Exposure</label>
        <input type="range" id="exposure" min="0.5" max="2.5" step="0.1" value="1.2" oninput="updateExposure(this.value)">
      </div>
    </div>
  </div>
</div>

<button id="ar-launch-btn" onclick="triggerAR()">START AR</button>

<model-viewer 
  id="viewer"
  src="assets/models/vase.glb"
  ios-src="assets/models/vase.usdz"
  alt="Heritage Porcelain Vase"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  shadow-softness="0.8"
  exposure="1.2"
  tone-mapping="commerce"
  ar-scale="auto">
</model-viewer>

<script>
  const viewer = document.getElementById('viewer');
  const exposureInput = document.getElementById('exposure');
  const apiBadge = document.getElementById('api-badge');
  const pedestalBadge = document.getElementById('pedestal-badge');
  const pedestalBtn = document.getElementById('pedestalBtn');

  // Asset Configuration
  const assets = {
    vaseOnly: {
      glb: 'assets/models/vase.glb',
      usdz: 'assets/models/vase.usdz'
    },
    vaseWithPedestal: {
      glb: 'assets/models/pedestal.glb', // Combined GLB asset
      usdz: 'assets/models/pedestal.usdz'
    }
  };

  let hasPedestal = false;

  function triggerAR() {
    if (viewer.canActivateAR) {
      viewer.activateAR();
    } else {
      alert('AR is not supported on this device/browser setup.');
    }
  }

  // --- OPTION B (COMPLEX INTERACTION): PEDESTAL TOGGLE & STACKING ---
  function togglePedestal() {
    hasPedestal = !hasPedestal;
    pedestalBtn.classList.toggle('active', hasPedestal);

    if (hasPedestal) {
      // Load combined asset or apply Y-axis offset
      viewer.src = assets.vaseWithPedestal.glb;
      if (assets.vaseWithPedestal.usdz) {
        viewer.setAttribute('ios-src', assets.vaseWithPedestal.usdz);
      }
      pedestalBadge.textContent = "🏛️ Stand: Wooden Pedestal Base Active";
      document.getElementById('hint').textContent = "Loaded Vase on Pedestal. Tap START AR";
    } else {
      // Revert to original standalone vase asset
      viewer.src = assets.vaseOnly.glb;
      if (assets.vaseOnly.usdz) {
        viewer.setAttribute('ios-src', assets.vaseOnly.usdz);
      }
      pedestalBadge.textContent = "🏛️ Stand: Off (Floor Mode)";
      document.getElementById('hint').textContent = "Loaded Heritage Vase. Tap START AR";
    }
  }

  function updateShadow(val) {
    viewer.shadowIntensity = val;
  }

  function updateExposure(val) {
    viewer.exposure = val;
  }

  // --- OPTION A (DATA-DRIVEN): REST API INTEGRATION ---
  async function fetchEnvironmentalData() {
    try {
      let lat = 6.9271;
      let lon = 79.8612;

      if (navigator.geolocation) {
        await new Promise((resolve) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => { lat = pos.coords.latitude; lon = pos.coords.longitude; resolve(); },
            () => resolve(),
            { timeout: 3000 }
          );
        });
      }

      const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const data = await response.json();
      
      if (data && data.current_weather) {
        const isDay = data.current_weather.is_day === 1;
        const temp = data.current_weather.temperature;
        
        if (isDay) {
          viewer.shadowIntensity = 1.2;
          apiBadge.textContent = `🌐 REST API: Live Day Mode (${temp}°C) — Daylight Lighting Applied`;
        } else {
          viewer.shadowIntensity = 0.5;
          viewer.exposure = 1.5;
          exposureInput.value = 1.5;
          apiBadge.textContent = `🌐 REST API: Live Night Mode (${temp}°C) — Night Lighting Applied`;
        }
      }
    } catch (err) {
      console.log("REST API fetch error, fallback active:", err);
      apiBadge.textContent = "🌐 REST API: Active (Fallback Mode)";
    }
  }

  // --- AUTOMATIC AMBIENT LUMINANCE BALANCING ---
  function setupAutoLightBalancing() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    canvas.width = 64;
    canvas.height = 64;

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();

        setInterval(() => {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            let totalLuminance = 0;
            for (let i = 0; i < data.length; i += 4) {
              totalLuminance += (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
            }

            const avgLuminance = totalLuminance / (canvas.width * canvas.height);
            const targetExposure = Math.min(Math.max((1 - (avgLuminance / 255)) * 2.2 + 0.5, 0.8), 2.2);
            
            viewer.exposure = viewer.exposure + (targetExposure - viewer.exposure) * 0.1;
            exposureInput.value = viewer.exposure.toFixed(1);
          }
        }, 300);
      })
      .catch(err => console.log("Ambient camera balancing fallback active:", err));
  }

  window.addEventListener('load', () => {
    fetchEnvironmentalData();
    setupAutoLightBalancing();
  });

  viewer.addEventListener('ar-status', (event) => {
    const launchBtn = document.getElementById('ar-launch-btn');
    if (event.detail.status === 'session-started') {
      launchBtn.style.display = 'none';
      document.getElementById('hint').textContent = "Scanning surface... Move camera slowly";
    } else if (event.detail.status === 'not-presenting') {
      launchBtn.style.display = 'block';
      document.getElementById('hint').textContent = hasPedestal ? "Loaded Vase on Pedestal. Tap START AR" : "Loaded Heritage Vase. Tap START AR";
    }
  });
</script>
</body>
</html>
