<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Markerless AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  *{margin:0;padding:0;}
  body{overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;}
  #ui{
    position:fixed;inset:0;pointer-events:none;z-index:20;
  }
  #topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:16px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    pointer-events:auto;
  }
  #topbar a{
    color:#fff;text-decoration:none;font-size:14px;font-weight:600;
    background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:20px;
  }
  #status{
    color:#fff;font-size:13px;
    background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:20px;
  }
  #controls{
    position:absolute;bottom:0;left:0;right:0;
    display:flex;justify-content:center;gap:12px;
    padding:16px 20px 30px;
    background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    pointer-events:auto;
    flex-wrap:wrap;
  }
  button{
    border:none;border-radius:30px;padding:10px 20px;
    font-size:13px;font-weight:600;
    background:rgba(255,255,255,0.2);color:#fff;
    backdrop-filter:blur(8px);cursor:pointer;
  }
  button.active{
    background:#c9a13a;color:#2a2320;
  }
  button:active{transform:scale(0.95);}
  #hint{
    position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
    color:#fff;background:rgba(0,0,0,0.7);
    padding:10px 20px;border-radius:12px;font-size:13px;
    text-align:center;pointer-events:none;max-width:80%;
  }
  #info-popup{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#fff;background:rgba(0,0,0,0.85);
    padding:20px 24px;border-radius:12px;font-size:14px;
    text-align:center;display:none;pointer-events:none;max-width:80%;
    border:2px solid #c9a13a;
  }
</style>
</head>
<body>
<div id="ui">
  <div id="topbar">
    <a href="index.html">← Home</a>
    <span id="status">🌐 Tap to place</span>
  </div>
  <div id="hint">🔍 Look at a flat surface, then tap to place artifacts</div>
  <div id="info-popup">🏛️ Artifact placed!<br><span style="font-size:12px;color:#c9a13a;">Click to remove</span></div>
  <div id="controls">
    <button id="placeBtn" class="active" onclick="placeArtifact()">📌 Place Artifact</button>
    <button id="clearBtn" onclick="clearAll()">🗑️ Clear All</button>
  </div>
</div>

<a-scene id="scene" embedded vr-mode-ui="enabled: false" webxr="optionalFeatures: local-floor;" renderer="antialias: true; alpha: true;">
  <a-camera id="camera" position="0 1.6 0" raycaster="far: 5;">
    <a-entity id="reticle" geometry="primitive: ring; radiusInner: 0.05; radiusOuter: 0.08;" material="color: #c9a13a; transparent: true; opacity: 0.8; side: double;" position="0 0 -2" visible="true"></a-entity>
  </a-camera>
  <a-entity id="artifacts-container" position="0 0 0"></a-entity>
  <a-light type="ambient" intensity="0.6"></a-light>
  <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>
  <a-light type="directional" intensity="0.4" position="-1 1 -1"></a-light>
</a-scene>

<script>
  const scene = document.querySelector('#scene');
  const reticle = document.querySelector('#reticle');
  const container = document.querySelector('#artifacts-container');
  const hint = document.querySelector('#hint');
  const status = document.querySelector('#status');
  const infoPopup = document.querySelector('#info-popup');
  let placedCount = 0;
  let placementMode = true;

  function updateReticle() {
    if (reticle) {
      reticle.setAttribute('visible', 'true');
      const scale = 0.9 + 0.1 * Math.sin(Date.now() / 500);
      reticle.setAttribute('scale', scale + ' ' + scale + ' ' + scale);
    }
  }
  updateReticle();

  function placeArtifact() {
    if (!placementMode) return;
    const pos = reticle.getAttribute('position');
    if (!pos) return;
    
    placedCount++;
    const colors = ['#c9a13a', '#6e1f2a', '#2a6e4a', '#4a6e8a'];
    const color = colors[placedCount % colors.length];
    const shapes = ['box', 'sphere', 'cylinder'];
    const shape = shapes[placedCount % shapes.length];
    
    const artifact = document.createElement('a-entity');
    artifact.setAttribute('position', pos.x + ' ' + pos.y + ' ' + pos.z);
    artifact.setAttribute('scale', '0.3 0.3 0.3');
    
    if (shape === 'box') {
      artifact.setAttribute('geometry', 'primitive: box; width: 0.4; height: 0.4; depth: 0.4;');
    } else if (shape === 'sphere') {
      artifact.setAttribute('geometry', 'primitive: sphere; radius: 0.25;');
    } else {
      artifact.setAttribute('geometry', 'primitive: cylinder; radius: 0.2; height: 0.4;');
    }
    
    artifact.setAttribute('material', 'color: ' + color + '; roughness: 0.3; metalness: 0.5;');
    artifact.setAttribute('class', 'artifact');
    artifact.setAttribute('animation', 'property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear');
    artifact.setAttribute('animation__float', 'property: position; to: 0 0.05 0; loop: true; dur: 1500; dir: alternate; easing: easeInOutQuad');
    artifact.setAttribute('data-id', placedCount);
    
    artifact.addEventListener('click', function(e) {
      e.stopPropagation();
      showInfo('Removed artifact #' + this.getAttribute('data-id'));
      this.parentNode.removeChild(this);
      placedCount--;
      if (placedCount === 0) {
        hint.style.display = 'block';
        status.textContent = '🌐 Tap to place';
      }
    });
    
    container.appendChild(artifact);
    status.textContent = '✅ ' + placedCount + ' artifact' + (placedCount > 1 ? 's' : '') + ' placed';
    hint.style.display = 'none';
    showInfo('Placed artifact #' + placedCount + ' (' + shape + ')');
    
    if (reticle) {
      reticle.setAttribute('material', 'color: #ff6b6b; opacity: 1;');
      setTimeout(function() {
        reticle.setAttribute('material', 'color: #c9a13a; opacity: 0.8;');
      }, 300);
    }
  }

  function showInfo(text) {
    infoPopup.innerHTML = text;
    infoPopup.style.display = 'block';
    setTimeout(function() {
      infoPopup.style.display = 'none';
    }, 2000);
  }

  function clearAll() {
    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }
    placedCount = 0;
    status.textContent = '🌐 Tap to place';
    hint.style.display = 'block';
    showInfo('🗑️ All artifacts cleared');
  }

  scene.addEventListener('click', function(e) {
    const target = e.target;
    if (target.classList && target.classList.contains('artifact')) {
      return;
    }
    if (placementMode) {
      placeArtifact();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'p' || e.key === 'P') placeArtifact();
    if (e.key === 'c' || e.key === 'C') clearAll();
  });

  window.placeArtifact = placeArtifact;
  window.clearAll = clearAll;
</script>
</body>
</html>
