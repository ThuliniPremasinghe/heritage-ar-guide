<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Markerless AR</title>
<style>
  body{margin:0;overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;}
  #ui{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    pointer-events:none;
    z-index:10;
  }
  #topbar{
    display:flex;
    justify-content:space-between;
    padding:16px 20px;
    background:linear-gradient(to bottom,rgba(0,0,0,0.5),transparent);
  }
  #topbar a{
    color:white;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    background:rgba(0,0,0,0.4);
    padding:8px 16px;
    border-radius:20px;
    pointer-events:auto;
  }
  #hint{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:13px;
    background:rgba(0,0,0,0.6);
    padding:8px 16px;
    border-radius:20px;
    text-align:center;
    max-width:80%;
    pointer-events:none;
  }
  #controls{
    position:absolute;
    bottom:30px;
    left:0;right:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    pointer-events:auto;
  }
  .row{display:flex;gap:10px;}
  button{
    border:none;
    border-radius:30px;
    padding:10px 18px;
    font-size:13px;
    font-weight:600;
    background:rgba(0,0,0,0.6);
    color:white;
    backdrop-filter:blur(8px);
    cursor:pointer;
  }
  button.active{background:#c9a13a;color:#2a2320;}
  #ar-button-container{
    position:fixed;
    bottom:100px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    pointer-events:auto;
  }
  #ar-button-container button{
    background:#6e1f2a;
    padding:14px 32px;
    font-size:16px;
    border-radius:40px;
    border:none;
    color:white;
    font-weight:700;
    cursor:pointer;
  }
  #not-supported{
    position:fixed;
    inset:0;
    display:none;
    background:rgba(0,0,0,0.9);
    color:white;
    align-items:center;
    justify-content:center;
    z-index:50;
    text-align:center;
    padding:32px;
  }
  #not-supported.show{display:flex;}
  #not-supported p{max-width:400px;line-height:1.6;}
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">← Home</a>
  </div>
  <div id="hint">👆 Move phone to find a surface, then tap to place</div>
  <div id="controls">
    <div class="row">
      <button id="selectCube" class="active" onclick="selectType('cube')">📦 Cube</button>
      <button id="selectSphere" onclick="selectType('sphere')">⚪ Sphere</button>
    </div>
    <div class="row">
      <button onclick="clearObjects()">🗑️ Clear All</button>
    </div>
  </div>
</div>

<div id="ar-button-container"></div>
<div id="not-supported">
  <div>
    <h2>WebXR Not Supported</h2>
    <p>This browser doesn't support WebXR with hit-testing.<br>
    Please use Chrome on Android or a compatible AR device.</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';

let scene, camera, renderer;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let placedObjects = [];
let selectedType = 'cube';
let isDragging = false;
let dragTarget = null;

// Get DOM elements
const hint = document.getElementById('hint');
const notSupported = document.getElementById('not-supported');

// Export functions to window
window.selectType = function(type) {
  selectedType = type;
  document.getElementById('selectCube').classList.toggle('active', type === 'cube');
  document.getElementById('selectSphere').classList.toggle('active', type === 'sphere');
};

window.clearObjects = function() {
  placedObjects.forEach(obj => scene.remove(obj));
  placedObjects = [];
  isDragging = false;
  dragTarget = null;
  hint.textContent = '👆 Move phone to find a surface, then tap to place';
};

// Check WebXR support
if (!('xr' in navigator)) {
  notSupported.classList.add('show');
}

function init() {
  scene = new THREE.Scene();
  
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
  
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(0, 1, 0.5);
  scene.add(dirLight);

  // Reticle (shows where objects will be placed)
  const reticleGeo = new THREE.RingGeometry(0.05, 0.07, 32);
  const reticleMat = new THREE.MeshBasicMaterial({ color: 0xc9a13a });
  reticle = new THREE.Mesh(reticleGeo, reticleMat);
  reticle.rotation.x = -Math.PI / 2;
  reticle.visible = false;
  scene.add(reticle);

  // AR Button
  const arButton = ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test']
  });
  document.getElementById('ar-button-container').appendChild(arButton);

  // Controller for tap events
  const controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  window.addEventListener('resize', onResize);
  renderer.setAnimationLoop(render);
}

function createObject(type) {
  const group = new THREE.Group();
  
  if (type === 'cube') {
    const geo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
    const mat = new THREE.MeshStandardMaterial({ 
      color: 0xc9a13a, 
      metalness: 0.3, 
      roughness: 0.4 
    });
    const mesh = new THREE.Mesh(geo, mat);
    group.add(mesh);
  } else {
    const geo = new THREE.SphereGeometry(0.06, 16, 16);
    const mat = new THREE.MeshStandardMaterial({ 
      color: 0x6e1f2a, 
      metalness: 0.5, 
      roughness: 0.3 
    });
    const mesh = new THREE.Mesh(geo, mat);
    group.add(mesh);
    // Small highlight
    const highlight = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffd700 })
    );
    highlight.position.y = 0.04;
    group.add(highlight);
  }
  
  // Add glow effect
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 8, 8),
    new THREE.MeshBasicMaterial({ 
      color: type === 'cube' ? 0xc9a13a : 0x6e1f2a, 
      transparent: true, 
      opacity: 0.2 
    })
  );
  group.add(glow);
  
  return group;
}

function onSelect() {
  if (!reticle.visible) return;
  
  // If dragging, drop the object
  if (isDragging && dragTarget) {
    isDragging = false;
    dragTarget = null;
    hint.textContent = '👆 Tap to place new objects';
    return;
  }
  
  // Check if tapping on existing object (drag)
  const tapPos = new THREE.Vector3();
  reticle.getWorldPosition(tapPos);
  
  for (const obj of placedObjects) {
    const objPos = new THREE.Vector3();
    obj.getWorldPosition(objPos);
    if (objPos.distanceTo(tapPos) < 0.12) {
      // Start dragging this object
      isDragging = true;
      dragTarget = obj;
      hint.textContent = '✋ Drag to move, tap again to drop';
      return;
    }
  }
  
  // Place new object
  const newObj = createObject(selectedType);
  const pos = new THREE.Vector3();
  reticle.getWorldPosition(pos);
  newObj.position.copy(pos);
  newObj.position.y += 0.05;
  scene.add(newObj);
  placedObjects.push(newObj);
}

function render(timestamp, frame) {
  if (frame) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();
    
    if (!hitTestSourceRequested && session) {
      session.requestReferenceSpace('viewer').then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      hitTestSourceRequested = true;
    }
    
    if (hitTestSource && frame) {
      const results = frame.getHitTestResults(hitTestSource);
      if (results.length > 0) {
        const hit = results[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        
        // If dragging, move the target with reticle
        if (isDragging && dragTarget) {
          const pos = new THREE.Vector3();
          reticle.getWorldPosition(pos);
          dragTarget.position.copy(pos);
          dragTarget.position.y += 0.05;
        }
      } else {
        reticle.visible = false;
      }
    }
  }
  
  // Animate objects
  placedObjects.forEach((obj, i) => {
    obj.rotation.y += 0.01;
    obj.position.y += Math.sin(Date.now() / 1000 + i) * 0.0002;
  });
  
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
</script>
</body>
</html>
