<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Markerless Mode</title>
<style>
  :root{ --maroon:#6e1f2a; --gold:#c9a13a; --cream:#f4ecdc; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#000; }
  canvas{ display:block; }

  #ui{ position:fixed; inset:0; pointer-events:none; z-index:20; }
  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(to bottom, rgba(20,10,8,0.55), transparent);
    pointer-events:auto;
  }
  #topbar a{
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(0,0,0,0.35); padding:8px 12px; border-radius:20px;
  }
  #hint{
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:12px; font-weight:500; text-align:center;
    background:rgba(0,0,0,0.45); padding:8px 14px; border-radius:20px;
    pointer-events:none; max-width:80%;
  }
  #controls{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    pointer-events:auto;
  }
  .row{ display:flex; gap:10px; }
  button.pill{
    border:none; border-radius:999px; padding:12px 18px;
    background:rgba(0,0,0,0.55); color:#fff; font-size:13px; font-weight:600;
    backdrop-filter: blur(6px);
  }
  button.pill.active{ background:var(--gold); color:#2a2320; }
  button.pill:active{ filter:brightness(0.85); }

  #ar-button-holder{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    z-index:30; pointer-events:auto;
  }
  #ar-button-holder button{
    padding:14px 28px; border-radius:999px; border:none;
    background:var(--maroon); color:#fff; font-weight:700; font-size:14px;
  }

  #not-supported{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:var(--cream); color:#2a2320; text-align:center; padding:32px; z-index:50;
  }
  #not-supported.show{ display:flex; }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">&larr; Home</a>
  </div>
  <div id="hint">Move your phone slowly to find a flat surface, then tap to place</div>

  <div id="controls">
    <div class="row">
      <button class="pill active" id="selectVase" onclick="selectArtifact('vase')">Place: Vase</button>
      <button class="pill" id="selectRoom" onclick="selectArtifact('room')">Place: Porcelain Room</button>
    </div>
    <div class="row">
      <button class="pill" onclick="resetPlacedObjects()">↺ Reset exhibit</button>
    </div>
  </div>
</div>

<div id="ar-button-holder"></div>

<div id="not-supported">
  <div>
    <h2 style="font-family:serif;">WebXR AR not available</h2>
    <p style="max-width:40ch;margin:0 auto;">
      This device or browser doesn't support the WebXR Device API with
      hit-testing (common on iOS Safari). Try the latest Chrome on an
      ARCore-capable Android phone.
    </p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------------------------------------------------------
   INTE 42312 — Option B (Complex Interaction):
   1) Multi-step state management: idle -> dragging -> idle
   2) Drag-and-drop object manipulation: tap to place, tap an
      existing object to pick it up, move phone to drag it,
      tap again to drop it.
   3) Physical collision detection between 3D elements: on
      every frame, bounding boxes of all placed objects are
      checked pairwise; overlapping objects flash red.
--------------------------------------------------------- */
let appState = 'idle';
let currentArtifactType = 'vase'; // which prefab gets placed on next tap
let selectedForDrag = null;       // the placed object currently being dragged

let camera, scene, renderer;
let controller;
let reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;

const placedObjects = []; // { mesh, box3 }
const loader = new GLTFLoader();

// Cache the loaded scenes once, then clone for each placement so we
// don't re-download the .glb every time the user taps to place one.
const modelCache = {}; // { vase: THREE.Object3D | null, room: THREE.Object3D | null }

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // Lighting
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.1);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffe6b0, 0.8);
  dir.position.set(0.5, 1, 0.25);
  scene.add(dir);

  // AR button — requires hit-test feature per assignment spec
  const arButton = ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.getElementById('ui') }
  });
  document.getElementById('ar-button-holder').appendChild(arButton);

  if (!('xr' in navigator)) {
    document.getElementById('not-supported').classList.add('show');
  }

  // Reticle: shows where a surface has been detected
  const reticleGeo = new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2);
  const reticleMat = new THREE.MeshBasicMaterial({ color: 0xc9a13a });
  reticle = new THREE.Mesh(reticleGeo, reticleMat);
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  window.addEventListener('resize', onWindowResize);

  renderer.setAnimationLoop(render);

  // Preload both models up front so placement isn't delayed by network.
  preloadModel('vase', 'assets/models/vase.glb');
  preloadModel('room', 'assets/models/the_porcelain_room.glb');
}

/* ---------------------------------------------------------
   Model loading. Real .glb assets — cached once loaded, then
   cloned for every new placement. Start scale values below are
   guesses; adjust once you see how big each renders in AR —
   the_porcelain_room.glb in particular may have been modelled
   at full room scale, so it likely needs shrinking a lot more
   than the vase to fit a tabletop.
--------------------------------------------------------- */
function preloadModel(key, path) {
  loader.load(
    path,
    (gltf) => {
      modelCache[key] = gltf.scene;
      console.log(`✅ Loaded ${path}`);
      updateHint(`Move your phone slowly to find a flat surface, then tap to place`);
    },
    undefined,
    (error) => {
      console.error(`❌ Failed to load ${path} — check the file exists at that path`, error);
      updateHint(`⚠️ Couldn't load ${path.split('/').pop()} — check console`);
    }
  );
}

function makePrefab(type) {
  const source = modelCache[type];
  if (!source) {
    console.warn(`${type}.glb hasn't finished loading yet — try again in a moment.`);
    return null;
  }
  const group = source.clone(true);
  group.userData.type = type;
  if (type === 'vase') {
    group.scale.set(0.3, 0.3, 0.3);
  } else if (type === 'room') {
    // Likely a much bigger source scale — shrink hard to sit on a table.
    group.scale.set(0.05, 0.05, 0.05);
  }
  return group;
}

window.selectArtifact = function (type) {
  currentArtifactType = type;
  document.getElementById('selectVase').classList.toggle('active', type === 'vase');
  document.getElementById('selectRoom').classList.toggle('active', type === 'room');
};

window.resetPlacedObjects = function () {
  placedObjects.forEach(o => scene.remove(o.mesh));
  placedObjects.length = 0;
  selectedForDrag = null;
  appState = 'idle';
};

/* ---------------------------------------------------------
   Placement / drag state machine
--------------------------------------------------------- */
function onSelect() {
  if (selectedForDrag) {
    // second tap: drop the object we were dragging
    selectedForDrag = null;
    appState = 'idle';
    updateHint('Move your phone slowly to find a flat surface, then tap to place');
    return;
  }

  // try to select an existing placed object first (tap-to-drag)
  const hit = pickPlacedObject();
  if (hit) {
    selectedForDrag = hit;
    appState = 'dragging';
    updateHint('Dragging — move your phone, tap again to drop');
    return;
  }

  // otherwise place a brand-new artifact at the reticle
  if (reticle.visible) {
    const prefab = makePrefab(currentArtifactType);
    if (!prefab) return;
    prefab.position.setFromMatrixPosition(reticle.matrix);
    scene.add(prefab);
    const entry = { mesh: prefab, box3: new THREE.Box3() };
    placedObjects.push(entry);
  }
}

function pickPlacedObject() {
  if (!reticle.visible || placedObjects.length === 0) return null;
  const p = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
  let closest = null;
  let closestDist = 0.15; // selection radius in meters
  for (const obj of placedObjects) {
    const d = obj.mesh.position.distanceTo(p);
    if (d < closestDist) {
      closestDist = d;
      closest = obj;
    }
  }
  return closest;
}

/* ---------------------------------------------------------
   Collision detection: recompute bounding boxes every frame
   and flag any overlapping pair.
--------------------------------------------------------- */
function updateCollisions() {
  placedObjects.forEach(o => o.box3.setFromObject(o.mesh));

  placedObjects.forEach(o => {
    let colliding = false;
    for (const other of placedObjects) {
      if (other === o) continue;
      if (o.box3.intersectsBox(other.box3)) {
        colliding = true;
        break;
      }
    }
    setCollisionVisual(o.mesh, colliding);
  });
}

function setCollisionVisual(group, colliding) {
  group.traverse(child => {
    if (!child.isMesh || !child.material) return;
    // Real glTF models can have multiple materials per mesh —
    // handle both a single material and an array of materials safely.
    const materials = Array.isArray(child.material) ? child.material : [child.material];
    materials.forEach(mat => {
      if (!mat.color) return; // some materials (e.g. certain shaders) have no .color
      if (colliding) {
        if (mat.userData._origColor === undefined) {
          mat.userData._origColor = mat.color.getHex();
        }
        mat.color.setHex(0xd93c3c);
      } else if (mat.userData._origColor !== undefined) {
        mat.color.setHex(mat.userData._origColor);
      }
    });
  });
}

function updateHint(text) {
  document.getElementById('hint').textContent = text;
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function render(timestamp, frame) {
  if (frame) {
    const referenceSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        if (appState === 'dragging' && selectedForDrag) {
          selectedForDrag.mesh.position.setFromMatrixPosition(reticle.matrix);
        }
      } else {
        reticle.visible = false;
      }
    }
  }

  updateCollisions();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
