<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Advanced Markerless Mode</title>

<!-- Google Model Viewer Library -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<style>
  :root { --maroon:#6e1f2a; --gold:#c9a13a; --cream:#f4ecdc; }
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#111; }

  model-viewer {
    width: 100vw;
    height: 100vh;
    background-color: #111;
  }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:20; }
  
  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    pointer-events:auto;
  }
  #topbar a {
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(0,0,0,0.45); padding:8px 14px; border-radius:20px;
  }

  #hint {
    position:absolute; top:65px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:12px; font-weight:500; text-align:center;
    background:rgba(0,0,0,0.65); padding:8px 16px; border-radius:20px;
    pointer-events:none; max-width:85%; width: max-content;
  }

  #controls {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    pointer-events:auto;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  }
  .row { display:flex; gap:10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  
  button.pill {
    border:none; border-radius:999px; padding:10px 16px;
    background:rgba(0,0,0,0.65); color:#fff; font-size:12px; font-weight:600;
    backdrop-filter: blur(6px); cursor: pointer; border: 1px solid rgba(255,255,255,0.15);
  }
  button.pill.active { background:var(--gold); color:#2a2320; border-color:var(--gold); }

  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 20px;
    color: #fff;
    font-size: 11px;
    backdrop-filter: blur(6px);
  }
  .control-group input[type=range] { width: 70px; }

  #ar-launch-btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    pointer-events: auto;
    background: var(--gold);
    color: #000;
    border: none;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 32px;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">&larr; Home</a>
  </div>
  <div id="hint">Loaded Vase. Tap START AR to place in real space</div>

  <div id="controls">
    <!-- Model Switcher -->
    <div class="row">
      <button class="pill active" id="selectVase" onclick="switchArtifact('vase')">🏺 Place: Vase</button>
      <button class="pill" id="selectRoom" onclick="switchArtifact('room')">🏛️ Place: Room</button>
    </div>

    <!-- Advanced Option B: Material Color Customization -->
    <div class="row">
      <button class="pill" onclick="changeColor('#ffffff')">⚪ Original</button>
      <button class="pill" onclick="changeColor('#c9a13a')">🟡 Gold Tint</button>
      <button class="pill" onclick="changeColor('#6e1f2a')">🔴 Maroon Tint</button>
    </div>

    <!-- Lighting, Color Balancing & Shadow Controls -->
    <div class="row">
      <div class="control-group">
        <label for="shadow">Shadow</label>
        <input type="range" id="shadow" min="0" max="2" step="0.1" value="1" oninput="updateShadow(this.value)">
      </div>
      <div class="control-group">
        <label for="exposure">Exposure</label>
        <input type="range" id="exposure" min="0.5" max="2" step="0.1" value="1" oninput="updateExposure(this.value)">
      </div>
    </div>
  </div>
</div>

<button id="ar-launch-btn" onclick="triggerAR()">START AR</button>

<!-- 
  MARKERLESS SPATIAL TRACKING CONFIGURATION:
  - ar: Enables spatial surface placement (WebXR / Quick Look / Scene Viewer)
  - shadow-intensity & shadow-softness: Ground plane shadow estimation
  - environment-image: Provides HDR image-based lighting (IBL) for color balancing
  - tone-mapping: Natural color rendition matching ambient lighting
-->
<model-viewer 
  id="viewer"
  src="assets/models/vase.glb"
  ios-src="assets/models/vase.usdz"
  alt="Heritage Artifact"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  shadow-softness="0.8"
  exposure="1"
  tone-mapping="commerce"
  ar-scale="auto">
</model-viewer>

<script>
  const models = {
    vase: {
      glb: 'assets/models/vase.glb',
      usdz: 'assets/models/vase.usdz',
      name: 'Vase'
    },
    room: {
      glb: 'assets/models/the_porcelain_room.glb',
      // usdz: 'assets/models/the_porcelain_room.usdz',
      name: 'Porcelain Room'
    }
  };

  let currentType = 'vase';
  const viewer = document.getElementById('viewer');

  if (models[currentType].usdz) {
    viewer.setAttribute('ios-src', models[currentType].usdz);
  }

  function switchArtifact(type) {
    currentType = type;
    document.getElementById('selectVase').classList.toggle('active', type === 'vase');
    document.getElementById('selectRoom').classList.toggle('active', type === 'room');

    viewer.src = models[type].glb;
    
    if (models[type].usdz) {
      viewer.setAttribute('ios-src', models[type].usdz);
    } else {
      viewer.removeAttribute('ios-src');
    }

    document.getElementById('hint').textContent = `Loaded ${models[type].name}. Tap START AR`;
  }

  function triggerAR() {
    if (viewer.canActivateAR) {
      viewer.activateAR();
    } else {
      alert('AR is not supported on this device/browser setup.');
    }
  }

  // --- ADVANCED FEATURE: Dynamic Shadow Control ---
  function updateShadow(val) {
    viewer.shadowIntensity = val;
  }

  // --- ADVANCED FEATURE: Color Balancing & Lighting Exposure Control ---
  function updateExposure(val) {
    viewer.exposure = val;
  }

  // --- ADVANCED FEATURE (Option B: Complex Interaction): Dynamic Material recoloring ---
  function changeColor(hexColor) {
    if (!viewer.model || !viewer.model.materials.length) return;
    const material = viewer.model.materials[0];
    material.pbrMetallicRoughness.setBaseColorFactor(hexToRgba(hexColor));
  }

  function hexToRgba(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16) / 255;
    const g = parseInt(c.substring(1, 3), 16) / 255;
    const b = parseInt(c.substring(2, 4), 16) / 255;
    return [r, g, b, 1.0];
  }

  // Manage UI state during AR Session
  viewer.addEventListener('ar-status', (event) => {
    const launchBtn = document.getElementById('ar-launch-btn');
    if (event.detail.status === 'session-started') {
      launchBtn.style.display = 'none';
      document.getElementById('hint').textContent = "Scanning surface... Move camera slowly";
    } else if (event.detail.status === 'not-presenting') {
      launchBtn.style.display = 'block';
      document.getElementById('hint').textContent = `Loaded ${models[currentType].name}. Tap START AR`;
    }
  });
</script>
</body>
</html>
