<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Heritage AR Guide — Markerless Mode</title>

<!-- Google Model Viewer Library for Cross-Platform WebAR (iOS & Android) -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

<style>
  :root { --maroon:#6e1f2a; --gold:#c9a13a; --cream:#f4ecdc; }
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#111; }

  /* Model Viewer covers full viewport */
  model-viewer {
    width: 100vw;
    height: 100vh;
    background-color: #111;
    --postfix: "px";
  }

  #ui { position:fixed; inset:0; pointer-events:none; z-index:20; }
  
  #topbar {
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 14px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
    pointer-events:auto;
  }
  #topbar a {
    color:#fff; text-decoration:none; font-size:13px; font-weight:600;
    background:rgba(0,0,0,0.45); padding:8px 14px; border-radius:20px;
  }

  #hint {
    position:absolute; top:65px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:12px; font-weight:500; text-align:center;
    background:rgba(0,0,0,0.65); padding:8px 16px; border-radius:20px;
    pointer-events:none; max-width:85%; width: max-content;
  }

  #controls {
    position:absolute; bottom:0; left:0; right:0;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding: 18px 16px max(18px, env(safe-area-inset-bottom));
    pointer-events:auto;
  }
  .row { display:flex; gap:10px; flex-wrap: wrap; justify-content: center; }
  
  button.pill {
    border:none; border-radius:999px; padding:12px 18px;
    background:rgba(0,0,0,0.65); color:#fff; font-size:13px; font-weight:600;
    backdrop-filter: blur(6px); cursor: pointer;
  }
  button.pill.active { background:var(--gold); color:#2a2320; }

  /* Custom Launch AR Button */
  #ar-launch-btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    pointer-events: auto;
    background: var(--gold);
    color: #000;
    border: none;
    font-weight: 700;
    font-size: 16px;
    padding: 16px 32px;
    border-radius: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="ui">
  <div id="topbar">
    <a href="index.html">&larr; Home</a>
  </div>
  <div id="hint">Select an artifact and tap "START AR"</div>

  <div id="controls">
    <div class="row">
      <button class="pill active" id="selectVase" onclick="switchArtifact('vase')">🏺 Place: Vase</button>
      <button class="pill" id="selectRoom" onclick="switchArtifact('room')">🏛️ Place: Porcelain Room</button>
    </div>
  </div>
</div>

<button id="ar-launch-btn" onclick="triggerAR()">START AR</button>

<!-- Set Vase as the Default Active Model -->
<model-viewer 
  id="viewer"
  src="assets/models/vase.glb"
  alt="Heritage Vase"
  ar
  ar-modes="scene-viewer quick-look webxr"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  ar-scale="auto">
</model-viewer>

<script>
  const models = {
    vase: {
      glb: 'assets/models/vase.glb',
      usdz: 'assets/models/vase.usdz',
      name: 'Vase'
    },
    room: {
      glb: 'assets/models/the_porcelain_room.glb',
      usdz: 'assets/models/the_porcelain_room.usdz',
      name: 'Porcelain Room'
    }
  };

  let currentType = 'vase';
  const viewer = document.getElementById('viewer');

  function switchArtifact(type) {
    currentType = type;
    document.getElementById('selectVase').classList.toggle('active', type === 'vase');
    document.getElementById('selectRoom').classList.toggle('active', type === 'room');

    viewer.src = models[type].glb;
    
    // Only attach usdz if file exists on server
    if (models[type].usdz) {
      viewer.setAttribute('ios-src', models[type].usdz);
    } else {
      viewer.removeAttribute('ios-src');
    }

    document.getElementById('hint').textContent = `Loaded ${models[type].name}. Tap START AR`;
  }

  function triggerAR() {
    if (viewer.canActivateAR) {
      viewer.activateAR();
    } else {
      alert('AR is not supported on this device/browser setup.');
    }
  }

  viewer.addEventListener('ar-status', (event) => {
    const launchBtn = document.getElementById('ar-launch-btn');
    if (event.detail.status === 'session-started') {
      launchBtn.style.display = 'none';
    } else if (event.detail.status === 'not-presenting') {
      launchBtn.style.display = 'block';
    }
  });
</script>
</body>
</html>
